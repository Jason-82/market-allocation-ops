rebalancing_policy:
  purpose: "Use contribution-based rebalancing for normal drift; reserve taxable selling mainly for hard-band breaches."
  measurement_basis: "Apply bands to each holding's or monitored bucket's percentage of the total portfolio, not its percentage within the core or sleeve."
  soft_band:
    width_formula_percentage_points: "min(5.0, 0.25 * target_pct)"
    lower_bound_formula: "max(0, target_pct - soft_width)"
    upper_bound_formula: "target_pct + soft_width"
    default_action:
      - "Redirect new contributions toward underweight positions."
      - "Reduce or pause new contributions to overweight positions."
      - "Use dividends, distributions, and available cash."
      - "Do not default to taxable selling."
  hard_band:
    width_formula_percentage_points: "min(10.0, 0.40 * target_pct)"
    lower_bound_formula: "max(0, target_pct - hard_width)"
    upper_bound_formula: "target_pct + hard_width"
    additional_upside_concentration_trigger: "actual_pct > 2.0 * target_pct"
    default_action:
      - "Rebalance more affirmatively."
      - "Use new contributions and cash first."
      - "Consider tax-aware sales only if contribution-based correction is insufficient."
      - "Prefer HIFO tax-lot selection."
      - "Avoid selling lots held less than one year unless the hard breach genuinely requires it or Jason explicitly requests it."
  priority_order:
    - "Correct actual target gaps with new contributions."
    - "Use cash and distributions."
    - "Allow the Schwab robo to rebalance its own core."
    - "Use tax-aware sales only for unresolved hard breaches or an explicit user instruction."
  monitoring_scope:
    manual_sleeve_ETFs: "Official operational band checks."
    broad_regions: "Portfolio-level oversight checks."
    core_underlying_ETFs: "Reference and monitoring only when Schwab controls rebalancing."
    methodology_buckets: "Analytical decomposition; not independently rebalanced unless Jason adopts explicit targets for them."
  tax_guardrails:
    preferred_lot_method: "HIFO"
    short_term_sale_rule: "Avoid sales of lots held less than one year unless a hard-band breach or explicit user instruction overrides."
    default_bias: "Modify new contributions rather than sell."

computed_rebalancing_bands:
  note: |
    The original handoff transcribed soft/hard bands for every bucket and position. They are
    fully determined by the formulas above, so rather than duplicate ~30 derived tables here
    (which would drift from the targets), they are generated on demand:
        python3 tools/dca_calc.py --bands
    That reads the live sleeve targets so the bands cannot go stale against the spec.

operational_notes_for_another_AI:
  - "Do not change strategic targets because of a one-week risk score or temporary sleeve tilt."
  - "Before recommending a contribution tilt, compare current actual holdings with these targets; target-gap correction takes priority."
  - "If actual holdings are unavailable, label any tactical sleeve allocation as provisional and one-contribution-only."
  - "Do not classify DISV as U.S. small value."
  - "Do not assume the rounded Schwab core model equals the current robo statement; verify when precision matters."
  - "Do not roll HAUZ entirely into developed international without retaining the international-REIT classification caveat."
  - "Recalculate geographic and methodology totals after any ticker or target change and verify that all portfolio weights sum to 100%."
  - "Use total-portfolio weights when applying the soft and hard band formulas."

