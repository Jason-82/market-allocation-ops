value_tilt_analysis_2026_08_24:
  question: "Is Schwab Fundamental closer to market-cap or to value?"
  finding: "Closer to market-cap than the binary bucketing implied. Roughly HALF a value tilt."
  evidence:
    rafi_value_loading: "About half that of the Fama-French Large Value index, in 3-factor regressions."
    rafi_alpha: "Approximately zero (~0.1%/yr)."
    rafi_size_loading: "Slightly negative - a large-cap bias, not a small tilt."
    fndx_schx_correlation: "0.91, stable in a 0.81-0.91 range across timeframes."
    fndx_10y_return: "15.07% annualized vs 14.11% for the S&P 500 - fundamental did not lag."
    volatility: "FNDX 3.07% vs SCHX 2.99% - materially identical."
    sources:
      - "http://www.efficientfrontier.com/ef/0adhoc/fi.htm"
      - "https://www.bogleheads.org/wiki/Fundamental_indices"
      - "https://portfolioslab.com/tools/stock-comparison/FNDX/SCHX"
      - "https://www.macroaxis.com/invest/pair-correlation/SCHX/FNDX/Schwab-vs-Schwab"
  loading_weighted_result:
    method: "Weight each holding by its value loading: pure DFA value 1.0, Schwab/Invesco RAFI 0.5, DFAC 0.2, market-cap and QQQM/QUAL/SPMO 0.0."
    effective_value_tilt_pct_of_equity: 32.85
    interpretation: "Portfolio behaves like ~33% true value index, ~67% cap-weighted."
    binary_framing_for_contrast: "value 51.70% vs cap-like 48.30% - value appears to lead by 3.40pp"
    loading_framing: "cap-like leads by 34.30pp"
    conclusion: |
      The apparent value-overweight was an artifact of counting a half-loaded fund as fully
      value. Jason's instinct that fundamental sits closer to market-cap is correct.
  where_the_tilt_actually_lives:
    schwab_fundamental_robo: 55.1
    DEMSX: 19.5
    DISV: 7.5
    DFIV: 7.5
    DFEV: 6.2
    invesco_rafi: 3.3
    DFAC: 1.0
    note: |
      The robo supplies more than half the value exposure. The four DFA sleeve funds supply 21%
      combined. A sleeve reweighting to fix a "value problem" would operate on a fifth of it.
  decision: |
    Tilt reweighting DROPPED. Scenarios proposed on 2026-08-24 (shifting the sleeve toward
    QQQM/QUAL) were solving a problem the binary bucketing invented. Sleeve stays as revised.
  caveat: |
    The 0.5 loading comes from US large-cap studies (FNDX/SCHX, RAFI US). FNDF and FNDE are
    developed-international and EM, where fundamental tilts have historically run stronger. If
    FNDE's loading is 0.6-0.7, effective value tilt is a few points above 32.85%. Directionally
    unchanged; do not treat 32.85% as precise.

