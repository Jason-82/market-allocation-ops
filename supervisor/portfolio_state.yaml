tax_event_2026_09_18:
  reported_by: "Jason, 2026-09-18"
  event: "Amended returns produced large tax bills; approximately 1,000,000 less available than planned."
  effect_on_deployable_cash: "7,152,472.69 -> 6,152,472.69 (before any contributions made since 2026-08-25)"
  effect_on_total_investable: "10,788,478 -> approximately 9,788,478"
  baseline_response:
    old: 250000
    new: 215000
    method: "Proportional to remaining deployable cash, preserving the ~28.6-week horizon at 1.0x."
    why_not_hold_250000: |
      Holding the weekly dollar amount against a smaller pot shortens the horizon, which means
      deploying FASTER relative to remaining capital. The modules read Slow DCA, so that is the
      wrong direction. Scaling the baseline preserves both the horizon and the risk posture.
    why_not_change_the_multiplier: |
      The multiplier answers "given current risk, faster or slower than plan". Capital
      availability is not a risk signal. Changing the multiplier for a tax bill would corrupt
      the comparison of multipliers across runs.
  LEDGER_CONFIRMED_2026_09_18:
    contributions_since_2026_08_25:
      - {date: "2026-08-25", amount: 130000, destination: "robo core"}
