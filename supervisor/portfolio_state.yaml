    deployable_cash: 5922472.69
    baseline_final: 205000
    note: |
      The placeholder 215,000 assumed no contributions and was 10,000 too high. Corrected.
      The tax reserve is EARMARKED, NOT PAID. It stays in cash and is excluded from deployable
      cash. Do not deploy against it until Jason confirms the bills are settled.

  CORE_SLEEVE_DRIFT_2026_09_18:
