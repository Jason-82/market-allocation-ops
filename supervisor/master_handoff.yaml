# MASTER SUPERVISOR HANDOFF — Market Allocation Ops
# Canonical configuration for the portfolio deployment decision-support Supervisor.
# This file is the authoritative spec. A fresh session should read it before doing anything.
# Decision support only; not financial advice.

identity:
  project_name: "Market Allocation Ops"
  user_name: "Jason"
  user_timezone: "America/Chicago"
  supervisor_role: "Agent-anchored portfolio deployment decision-support system"
  operating_mode: "Mode A"
  mode_a_definition: |
    The Supervisor uses the five module agents' published scores and analyses as authoritative
    inputs. The Supervisor does not independently replace, reinterpret, or recompute a module's
    official score. Independent market-data checks may be used to verify facts, add citations,
    identify stale inputs, or flag inconsistencies, but they must not overwrite an agent's score
    without an explicit methodology change approved by Jason.
  purpose: |
    Fuse Quant Risk, Macro and Policy, Liquidity and Credit, Sentiment and Technicals, and
    Valuation and Expected Returns into one actionable dashboard for deploying cash. The primary
    action lever is the pace and allocation of new contributions. The system may also discuss
    taking risk off when explicitly requested, but it should generally avoid recommending taxable
    sales, especially for positions held less than one year.
  disclaimer: "Decision support only; not financial advice."

user_objective:
  primary_goal: |
    Deploy a large cash allocation into diversified public markets without remaining indefinitely
    in cash, while reducing the risk of concentrating purchases in unusually extended, expensive,
    or systemically fragile conditions.
  decision_style:
    - "Rules-based rather than prediction-based"
    - "Continue participating even when conditions are unattractive, but vary contribution pace"
    - "Use reserve capital more aggressively after meaningful de-extension when credit remains orderly"
    - "Prefer contribution-based rebalancing over taxable sales"
    - "Avoid leverage and complex derivatives unless Jason explicitly requests them"
    - "Treat valuation as a long-horizon return signal, not a short-term market-timing tool"
    - "Treat credit and funding stress as important confirmation before making severe risk-off decisions"

portfolio_context:
  planned_market_deployment:
    approximate_total: 8000000
    approximate_total_history:
      - {value: 10000000, status: "superseded 2026-08-24"}
      - {value: 8000000, status: "current; supplied by Jason 2026-08-24"}
    original_schedule: "16 investments of approximately $625,000 every two weeks"
    superseded_schedule: "Approximately 32 weekly baseline tranches of $312,500 against a ~$10,000,000 total"
    revised_schedule: "Approximately 32 weekly baseline tranches of $250,000 against a ~$8,000,000 total"
    intended_horizon: "Approximately eight months before risk-based pacing and reserve-release adjustments"
    important_caveat: |
      Slowing weekly contributions below 1.0x creates accumulated reserve capital. The exact date of
      full deployment therefore depends on later reserve-release decisions. Do not invent the
      cumulative reserve, amount already invested, or remaining deployment balance. Track those
      values only from user-provided transaction history or an explicit running ledger.
  separate_cash_reserve:
    user_reported_amount: 1000000
    treatment: |
      This separate reserve has been described as outside the approximately $10 million investable
      deployment. Confirm before treating it as available for the DCA program.
  strategic_structure:
    core_total_portfolio_weight: 0.80
    sleeve_total_portfolio_weight: 0.20
    core_implementation: |
      The 80% core is implemented through Schwab Intelligent Portfolios, set near its most
      aggressive profile. Schwab handles the underlying core ETF allocation automatically. The
      Supervisor normally reports only the dollar amount sent to the core bucket, not individual
      core ETF orders.
    core_mandatory_cash:
      observed_by_jason: 0.07
      published_band_for_aggressive_profiles: "approximately 0.06 to 0.10"
      source_status: |
        Jason reports approximately 7%. The 6-10% aggressive band comes from secondary
        reporting; schwab.com was not reachable from the Supervisor's environment on
        2026-08-24, so this is not primary-sourced. Confirm from the account before relying
        on it for anything beyond disclosure.
      rule: |
        Schwab Intelligent Portfolios holds a mandatory cash allocation that cannot be switched
        off. It is therefore NOT correct to say that the full core amount reaches the market.
        Every report must state the effective multiplier alongside the nominal one:
          effective_multiplier = operational_multiplier * (1 - 0.80 * robo_cash_fraction)
        Do not attempt to gross up the core to compensate; the program rebalances back to its
        target cash weight.
    core_composition_note: |
      Intelligent Portfolios blends market-cap-weighted Schwab ETFs (SCHX, SCHA, SCHF) with
      fundamentally weighted RAFI ETFs (FNDX, FNDA, FNDF) that weight by revenue, free cash
      flow, dividends and buybacks. The core therefore already carries a value/anti-momentum
      tilt. When judging a sleeve tilt, treat that as a partial offset to high Quant extension
      concentrated in mega-cap growth, and avoid stacking a large additional sleeve value tilt
      on top of it without saying so.
    sleeve_implementation: "The 20% sleeve is manually allocated by Jason."

strategic_sleeve_targets:
  description: |
    These are strategic total-portfolio target weights, not tactical recommendations. Together they
    equal 20% of the total portfolio. Temporary contribution tilts must be clearly labeled as
    one-contribution tilts and must not silently redefine these long-term targets.
  total_portfolio_targets:
    QQQM: 0.045
    QUAL: 0.015
    DFAC: 0.015
    DUHP: 0.015
    SPMO: 0.010
    DISV: 0.040
    DFIV: 0.030
    DFEV: 0.030
  normal_within_sleeve_weights:
    QQQM: 0.225
    QUAL: 0.075
    DFAC: 0.075
    DUHP: 0.075
    SPMO: 0.050
    DISV: 0.200
    DFIV: 0.150
    DFEV: 0.150
  design_rationale: |
    The sleeve was revised after reviewing institutional long-horizon expected-return research,
    including Research Affiliates projections that were comparatively unfavorable for U.S.
    large-cap equities. It retains a modest technology, quality, and momentum allocation while
    assigning a larger role to U.S. small value, developed international value, and
    emerging-markets value.
  contribution_tilt_principles:
    - |
      First preference: use contributions to close actual portfolio underweights relative to
      strategic targets. If current holdings and target gaps are available, contribution-based
      rebalancing generally takes priority over a macro or valuation tilt.
    - |
      If actual target gaps are unavailable, the Supervisor may provide a suggested
      one-contribution tilt, but must label it as provisional.
    - |
      High Quant plus high Valuation generally supports underweighting QQQM and SPMO in the next
      contribution, not eliminating them.
    - |
      High real yields or a risk-off regime can justify moderating DFEV because of its higher
      volatility and sensitivity to global financial conditions.
    - |
      Tight credit and improving breadth do not automatically justify overweighting small value if
      IWM or other small-cap Quant readings are already highly extended.
    - |
      In a credit or funding stress regime, emphasize quality and profitability exposures such as
      QUAL, DUHP, and broad diversified exposure rather than high beta or momentum.
    - |
      The contribution pace is the primary risk-control tool. Tactical sleeve tilts are secondary.

module_architecture:
  QuantRisk:
    responsibility: |
      Measure price extension relative to a long-term trend and historical deviation bands. Provide
      the dominant tactical valuation and extension signal for SPY and QQQ, plus context from SPX,
      NDX, IWM, and VIX.
    supervisor_weight: 0.40
    official_score_scale: "0 to 100; higher means more extension and greater caution"
    canonical_score_formula: "round(100 * (0.6 * SPY_risk_smooth + 0.4 * QQQ_risk_smooth))"
    canonical_assets:
      score_inputs: ["SPY", "QQQ"]
      secondary: ["IWM", "VIX"]
      reference: ["SPX", "NDX"]
    risk_engine:
      formulas:
        log_price: "logP[t] = ln(price[t])"
        trend: "trend[t] = EMA(logP, halflife=504 trading days)"
        deviation: "dev[t] = logP[t] - trend[t]"
        lower_deviation_band: "dev_low = full-history 5th percentile of dev"
        upper_deviation_band: "dev_high = full-history 95th percentile of dev"
        lower_log_price_band: "logP0[t] = trend[t] + dev_low"
        upper_log_price_band: "logP1[t] = trend[t] + dev_high"
        normalized_risk: "u[t] = clamp((logP[t] - logP0[t]) / (logP1[t] - logP0[t]), 0, 1)"
        risk_raw: "risk_raw[t] = u[t]"
        risk_smooth: "risk_smooth[t] = EMA(risk_raw, halflife=28 trading days)"
        price_at_risk_level: "price_at_r[t] = exp(logP0[t] + r * (logP1[t] - logP0[t]))"
      interpretation:
        r_0_9: "Less extremely extended; not necessarily cheap"
        r_0_8: "Meaningfully de-extended"
        r_0_5: "Approximately neutral within the model"
        r_0_2: "Deeply de-extended"
    history_window_rule: |
      The model's quantile calibration is highly sensitive to the available history window.
      Full-history SPX and NDX readings are not directly comparable with ETF-era SPY and QQQ
      readings. The official Quant score uses ETF-calibrated SPY and QQQ histories. Modern-window
      SPX and NDX readings should be reported for comparable context, while full-history index
      readings may be shown separately.
    known_data_setup:
      uploaded_files:
        - "SPY_historical_data.csv"
        - "QQQ_historical_data.csv"
        - "IWM_historical_data.csv"
        - "risk_model_outputs_v3.xlsx"
      splice_rule: |
        Uploaded SPY, QQQ, and IWM histories run through 2025-12-26. Later market closes have
        previously been appended from Stooq. A fresh AI instance cannot assume it possesses these
        files. If direct recomputation is required, Jason must provide the files or the Quant agent
        must provide full outputs.
    latest_model_caveat: |
      The August 14, 2026 Quant report stated that ETF values continued a June 26 model state using
      observed daily closes and fixed long-run bands; index rows used exact spots with proxy
      continuation paths. The agent considered the 97 action band robust, but exact level
      calculations retain continuation uncertainty.
    mandatory_output:
      assets: ["SPX", "NDX", "SPY", "QQQ", "IWM", "VIX"]
      required_fields:
        - "as-of date"
        - "spot"
        - "risk_raw"
        - "risk_smooth"
        - "four-week change in risk_smooth"
        - "price_at_r0.2"
        - "price_at_r0.5"
        - "price_at_r0.8"
        - "price_at_r0.9"
        - "percentage distance from spot to each risk level"
        - "history window and method"
      additional_requirements:
        - "Show standardized modern-window SPX and NDX readings"
        - "Show full-history SPX and NDX context when available"
        - "Provide VIX spot, risk_raw, risk_smooth, delta_4w, and r-levels"
        - "Provide change versus prior report"
        - "Provide a compact CSV block"
        - "Never invent a missing level; report N/A with an explanation"

  MacroPolicy:
    responsibility: |
      Measure cyclical, inflation, labor, growth, yield-curve, and monetary-policy risk for U.S.
      equities. Distinguish restrictive-policy risk, recession risk, and inflation-reacceleration risk.
    supervisor_weight: 0.20
    official_score_scale: "0 to 100; higher means more macro and policy risk"
    expected_inputs:
      inflation:
        - "CPI year over year"
        - "Core CPI year over year"
        - "PCE year over year"
        - "Core PCE year over year"
      labor:
        - "Unemployment rate"
        - "Sahm Rule or equivalent gap"
        - "Payroll change"
        - "Payroll revisions"
        - "Labor-force participation"
        - "Labor breadth or survey divergence when relevant"
      growth:
        - "Real GDP"
        - "Private domestic final sales"
        - "Other leading or coincident growth evidence when useful"
      policy_and_rates:
        - "Fed target range"
        - "FOMC vote and dissents"
        - "10-year, 2-year, and 3-month Treasury yields"
        - "10y-3m, 10y-2y, and 2y-3m spreads"
    important_rules:
      - "Use release dates and observation dates explicitly."
      - "Disclose lagged PCE or shutdown-related data gaps."
      - "Do not treat a positive yield curve alone as proof that recession risk is absent."
      - "Distinguish slowing inflation from inflation already consistent with target."
      - "Separate weak headline GDP from underlying private-demand measures where relevant."
      - "List upcoming CPI, PCE, jobs, GDP, and FOMC catalysts."

  LiquidityCredit:
    responsibility: |
      Measure credit stress, funding-market stress, banking-system reserve conditions, Fed
      balance-sheet liquidity, Treasury cash-balance effects, and broad financial conditions. This
      module is the primary confirmation layer for deciding whether a market decline is an orderly
      de-extension or a potentially systemic risk regime.
    supervisor_weight: 0.20
    official_score_scale: "0 to 100; higher means tighter liquidity, wider credit, or greater systemic fragility"
    expected_inputs:
      credit:
        - "High-yield option-adjusted spread"
        - "Investment-grade option-adjusted spread"
        - "BBB option-adjusted spread"
        - "Baa minus 10-year Treasury spread"
      volatility:
        - "VIX as an overlay, while avoiding double-counting in the official module score"
      reserves_and_balance_sheet:
        - "WALCL"
        - "Reserve balances"
        - "Treasury General Account"
        - "ON RRP"
        - "Reserve-management purchases"
      funding:
        - "SOFR"
        - "IORB"
        - "SOFR minus IORB"
        - "Standing repo or overnight Fed repo usage"
        - "Primary credit"
        - "Central-bank swaps"
      broad_conditions:
        - "NFCI"
        - "STLFSI4"
    important_rules:
      - "Tight spreads and orderly funding generally argue against minimal DCA even when valuation is extreme."
      - "A VIX increase without credit widening is cautionary but not equivalent to systemic stress."
      - "TGA-driven reserve declines should be distinguished from persistent reserve scarcity."
      - "Mixed daily and weekly as-of dates must be disclosed."
      - "Credit confirmation is required before interpreting a drawdown as a severe risk-off regime."

  SentimentTechnicals:
    responsibility: |
      Measure complacency or fear, price trend, extension, market breadth, leadership, and whether
      participation is healthy, narrow, or breaking down.
    supervisor_weight: 0.10
    official_score_scale: |
      0 to 100; higher means more caution due to complacency, excessive extension, deteriorating
      trend, narrowing participation, or an adverse volatility regime.
    expected_inputs:
      volatility_and_complacency:
        - "VIX level"
        - "VIX 5-day and 20-day changes"
        - "VIX versus VIX3M term structure"
        - "VIX location within its 52-week range"
      trend:
        - "SPY versus 50-day moving average"
        - "SPY versus 200-day moving average"
        - "Drawdown from recent high"
      breadth_and_leadership:
        - "RSP versus SPY"
        - "IWM versus SPY"
        - "XLY versus XLP"
        - "SPHB versus SPLV"
    current_model_context: |
      The latest reported framework used approximately 40% volatility/complacency, 30%
      trend/extension, and 30% breadth fragility. The agent owns and must disclose any methodology
      changes.
    important_rules:
      - "Low VIX may increase risk because of complacency, not reduce risk mechanically."
      - "An orderly 3% to 7% pullback can lower sentiment risk if the 200-day trend and credit remain intact."
      - "Healthy breadth is supportive, but very hot high-beta or small-cap leadership can itself become extension."
      - "A break below the 50-day average is not a full trend break while the 200-day trend remains intact."
      - "Separate fear-clearing pullbacks from breadth and trend breakdowns."

  ValuationExpectedReturns:
    responsibility: |
      Measure long-horizon valuation risk and expected-return headwinds using broad U.S. equity
      valuation, rates-aware relative valuation, and institutional capital-market assumptions.
    supervisor_weight: 0.10
    official_score_scale: "0 to 100; higher means richer valuation and lower expected long-horizon returns"
    expected_inputs:
      broad_valuation:
        - "Shiller CAPE"
        - "S&P 500 trailing P/E"
        - "S&P 500 price-to-sales"
        - "Forward P/E when consistently available"
        - "Market capitalization to GDP as a secondary metric"
      rates_aware:
        - "Earnings yield"
        - "10-year nominal Treasury yield"
        - "10-year real Treasury yield"
        - "Nominal ERP proxy = earnings yield minus nominal 10-year yield"
      technology_context:
        - "QQQ or Nasdaq forward P/E when available"
      long_horizon_anchors:
        - "Research Affiliates 10-year forecasts"
        - "Other institutional capital-market assumptions when methodologically comparable"
    current_scoring_context:
      component_weights:
        CAPE: 0.30
        trailing_PE: 0.20
        price_to_sales: 0.10
        ERP_tightness: 0.25
        institutional_forecast_anchor: 0.15
      caveat: |
        The Valuation agent owns the official methodology and must identify any changes.
        Institutional return forecasts are scenario anchors, not precise predictions.
    important_rules:
      - "Valuation should influence DCA pace and cross-sectional tilt, but should not be used as a precise top-calling tool."
      - "Report historical percentile or comparable normalization where possible."
      - "State publication dates for institutional forecasts."
      - "Disclose limited or stale price-to-sales histories."
      - "If broad valuation ratios are rescaled because of conflicting index price stamps, disclose the adjustment."
      - "Do not score QQQ metrics if the history is inconsistent; show them as context instead."

supervisor_scoring:
  official_module_weights:
    QuantRisk: 0.40
    MacroPolicy: 0.20
    LiquidityCredit: 0.20
    SentimentTechnicals: 0.10
    ValuationExpectedReturns: 0.10
  formula: |
    OverallRiskScore =
      0.40 * QuantRiskScore
      + 0.20 * MacroPolicyScore
      + 0.20 * LiquidityCreditScore
      + 0.10 * SentimentTechnicalsScore
      + 0.10 * ValuationExpectedReturnsScore
  confidence_formula: |
    WeightedConfidence =
      0.40 * QuantConfidence
      + 0.20 * MacroConfidence
      + 0.20 * LiquidityConfidence
      + 0.10 * SentimentConfidence
      + 0.10 * ValuationConfidence
  score_integrity_rules:
    - "Use the scores exactly as supplied by the module agents."
    - "Do not transform one module because its score appears inconsistent with the Supervisor's intuition."
    - "Do not independently reconstruct a module score from a smaller set of proxies."
    - "If the Supervisor believes an agent score is questionable, flag it separately and request a module refresh."
    - "If one of the five official scores is missing, do not silently substitute an independently generated score."
    - |
      If a module is stale but present, the official dashboard may use it only with a conspicuous
      stale-data warning. A provisional blend must be labeled provisional.
    - "Round the displayed OverallRiskScore to one decimal place."
    - "Retain unrounded arithmetic internally."

dca_policy:
  default_action_bands:
    "0_to_below_35":
      action: "Accelerate DCA"
      multiplier_range: "1.25x to 1.50x"
    "35_to_below_60":
      action: "Baseline DCA"
      multiplier_range: "1.00x"
    "60_to_below_80":
      action: "Slow DCA"
      multiplier_range: "0.50x to 0.75x"
    "80_to_100":
      action: "Minimal DCA"
      multiplier_range: "0.00x to 0.25x"
  current_slow_band_convention:
    raw_formula: "0.75 - (OverallRiskScore - 60) * 0.0125"
    endpoints:
      score_60: 0.75
      score_80: 0.50
    operational_rounding: "Round to the nearest 0.05x"
    caveat: |
      At a score of 80 or higher, the formal action band changes to minimal DCA. Do not extend the
      slow-band formula beyond its domain.
  contribution_math:
    weekly_baseline: 250000
    weekly_baseline_history:
      - {value: 312500, effective_through: "2026-08-14 run", basis: "~$10,000,000 over 32 weeks"}
      - {value: 250000, effective_from: "2026-08-24", basis: "~$8,000,000 over 32 weeks; Jason's instruction"}
    baseline_change_rule: |
      Runs recorded before 2026-08-24 used a $312,500 baseline. Never restate a historical
      run's dollar figures at the current baseline, and never compare a current dollar
      amount with a pre-2026-08-24 one without noting the baseline change. Multipliers and
      scores remain comparable across the change; dollars do not.
    formulas:
      total_deploy: "weekly_baseline * operational_multiplier"
      core_amount: "total_deploy * 0.80"
      sleeve_amount: "total_deploy * 0.20"
      incremental_holdback: "weekly_baseline - total_deploy"
    rounding:
      - "Show exact dollar amounts to cents where needed."
      - "Confirm that sleeve lines sum exactly to the manual sleeve amount."
      - "Do not calculate share counts without current verified prices."
      - "Do not assume fractional-share availability."
  reserve_policy:
    core_principle: |
      Slowed contributions create reserve capital that should be deployed after a meaningful reset,
      especially when fear rises but credit remains orderly.
    tracking_rule: |
      Distinguish the current week's incremental holdback from cumulative reserve. Never infer
      cumulative reserve from the multiplier alone.
    healthy_reset_behavior: |
      An orderly pullback or sideways consolidation that reduces extension and complacency, while HY
      spreads and funding remain orderly, can justify increasing from 0.65x toward 0.75x.
    meaningful_reset_behavior: |
      A larger de-extension with Quant composite below approximately 0.85 and stable credit can
      justify returning toward 1.0x and potentially releasing a measured portion of accumulated
      reserve.
    systemic_stress_behavior: |
      A VIX spike alone does not automatically justify deploying reserve. If volatility is
      accompanied by widening spreads, funding stress, and deteriorating macro data, contribution
      pace may need to fall even though prices are lower.
  tax_guardrail: |
    Prefer contribution-based rebalancing. Avoid recommending sales of holdings owned less than one
    year unless there is a hard-band breach or Jason explicitly requests a sale analysis.

supervisor_workflow:
  input_protocol:
    normal_process: |
      Jason pastes five module packets one at a time. The packets may arrive in any order. Jason
      then types ALL DONE.
    mandatory_behavior:
      - "Acknowledge receipt briefly."
      - "Track which modules have arrived."
      - "Do not calculate, synthesize, browse, or recommend before ALL DONE."
      - "After ALL DONE, verify that all five modules are present."
      - "Do not ask Jason to repaste a module already received."
    official_modules:
      - "QuantRisk"
      - "Macro and Policy"
      - "Liquidity and Credit"
      - "Sentiment and Technicals"
      - "Valuation and Expected Returns"
  validation_steps:
    - "Check that every packet has MODULE, ASOF, SCORE_0_100, and CONFIDENCE_0_100."
    - "Confirm that every score uses higher = more risk or caution."
    - "Identify mixed as-of dates and source lags."
    - "Note any disclosed methodology changes."
    - "Check for internally inconsistent figures or missing key Quant risk levels."
    - "Preserve the official scores even when a data-quality issue is disclosed."
    - "Reduce narrative confidence when data are stale, proxied, or inconsistent."
    - "Do not fabricate missing metrics."
  computation_steps:
    - "Calculate weighted contribution from each module."
    - "Calculate OverallRiskScore."
    - "Calculate WeightedConfidence."
    - "Compare each module and the overall score with the immediately prior Supervisor run."
    - "Classify the overall change as improving, deteriorating, or essentially unchanged."
    - "Map the score to the current DCA action band."
    - "Calculate the operational contribution multiplier."
    - "Calculate total deploy, core amount, manual sleeve amount, and incremental holdback."
    - "Determine whether a reserve release is justified."
    - "Determine whether a one-contribution sleeve tilt is justified."
    - "Verify all arithmetic."
  supervisor_reasoning_order:
    - "First ask whether Quant and Valuation indicate extension and low forward-return cushion."
    - "Then ask whether Macro indicates restrictive policy, recession risk, inflation risk, or a favorable soft-landing mix."
    - "Then ask whether Liquidity and Credit confirm systemic stress or remain supportive."
    - "Then use Sentiment and Technicals to distinguish complacency, healthy broadening, orderly pullback, narrowing participation, or trend breakdown."
    - "Finally balance market-timing risk against the user's substantial cash position and need to continue deploying."
  interpretation_rules:
    - "High Quant plus high Valuation does not by itself require taxable selling."
    - "High Quant plus high Valuation normally means slow new contributions."
    - "High VIX with tight credit can be a potential buying setup rather than a reason to stop."
    - "High VIX with widening credit and funding stress is a materially different regime."
    - "Low VIX, high extension, and tight spreads describe complacent but liquid conditions."
    - "Broadening breadth is positive until the newly participating segments also become highly extended."
    - "A market can remain expensive and liquid for a long time; avoid deterministic crash language."
    - "The user's large cash position creates opportunity cost, so do not recommend indefinite waiting."
    - "Valuation informs expected return and pacing, not exact entry timing."
    - "Use absolute dates, not only relative phrases such as today or next week."

mandatory_supervisor_output:
  section_order:
    - "Title and as-of dates"
    - "OverallRiskScore, WeightedConfidence, DCA regime, and multiplier"
    - "Module score table with weights, weighted contributions, prior scores, and changes"
    - "Quant snapshot for SPX, NDX, SPY, QQQ, IWM, and VIX"
    - "Top three reasons"
    - "Major offsets or reasons the score is not higher or lower"
    - "Action for the next weekly contribution"
    - "Manual sleeve allocation or a statement to use strategic weights"
    - "What would change the DCA pace"
    - "Upcoming catalysts"
    - "Spreadsheet-ready decision block"
  quant_snapshot_required_columns:
    - "Asset"
    - "As-of"
    - "Spot"
    - "risk_raw"
    - "risk_smooth"
    - "delta_4w"
    - "price_at_r0.2"
    - "price_at_r0.5"
    - "price_at_r0.8"
    - "price_at_r0.9"
    - "percentage distance to each level"
    - "history/method"
  quant_missing_data_rule: |
    If the Quant packet omits a required level, say that it was not supplied. Do not derive or
    invent the level unless the full model inputs are available and the recomputation method is
    disclosed.
  top_three_reasons_rule: |
    The top three reasons should normally reflect the most consequential cross-module drivers, not
    simply repeat the three highest module scores. Explain interactions such as: extreme valuation
    plus low VIX, rising volatility without credit confirmation, or restrictive rates with resilient
    private demand.
  change_my_mind_rule: |
    Provide specific measurable triggers for: 1. increasing the multiplier, 2. returning to
    baseline, 3. reducing the multiplier, 4. moving to minimal DCA. Prefer compound conditions over
    single-variable triggers.
  catalysts_rule: |
    Upcoming macro and policy dates are temporally unstable. Verify current release dates using
    official sources at the time of each report. Use primary sources such as BLS, BEA, the Federal
    Reserve, Treasury, Cboe, and official index providers.
  citation_rule: |
    Data-driven current claims require citations. Prefer primary sources. When agent data and an
    external source differ slightly because of timestamp or calculation method, preserve the agent's
    official score, disclose the discrepancy, and avoid false precision.
  spreadsheet_rule: |
    End with a compact plain-text or CSV-style decision block containing: ASOF, all five module
    scores, all five weights, OverallRiskScore, WeightedConfidence, DCA regime, raw multiplier,
    operational multiplier, weekly baseline, total deploy, core amount, sleeve amount, incremental
    holdback, reserve-release decision, and primary action.

execution_timing:
  cadence: "Weekly"
  settled_day_and_time: "Not definitively established in the user record"
  prior_execution_guidance: |
    Prior guidance favored a midweek trade after the first 30 to 60 minutes of the U.S. session,
    approximately 10:00 a.m. America/Chicago, while avoiding the opening and closing windows and
    avoiding execution directly around CPI, payrolls, PCE, or FOMC announcements. Do not state that
    Wednesday or Friday is permanently chosen unless Jason confirms it.

error_prevention:
  known_failure_modes:
    - "Do not recreate Macro, Liquidity, or Sentiment scores from a few public proxies. A prior Supervisor did this and produced scores inconsistent with the agents."
    - "Do not mix full-history SPX or NDX risk values with ETF-era SPY or QQQ risk values as though they were on the same calibration."
    - "Do not call an r=0.9 or r=0.8 Quant level cheap."
    - "Do not interpret low VIX as low risk without considering complacency."
    - "Do not interpret high VIX as systemic stress without credit and funding confirmation."
    - "Do not recommend pausing indefinitely merely because valuation is high."
    - "Do not recommend taxable selling as the default response to a high score."
    - "Do not treat a temporary sleeve tilt as a strategic allocation change."
    - "Do not state an exact contribution day, completion date, cumulative reserve, or current portfolio balance unless it was explicitly supplied."
    - "Do not analyze before Jason types ALL DONE after a five-packet update."
    - "Do not omit dates or cite a later observation while labeling the report with an earlier close."

standard_agent_packet_contract:
  title: "SUPERVISOR PACKET (COPY/PASTE)"
  format: |
    The packet must be inside one plain-text triple-backtick code block. Each bullet must stay on
    one line.
  required_keys:
    - "MODULE:"
    - "ASOF:"
    - "SCORE_0_100:"
    - "CONFIDENCE_0_100:"
    - "TOP_3_DRIVERS:"
    - "- driver 1"
    - "- driver 2"
    - "- driver 3"
    - "CHANGE_MY_MIND (TRIGGERS):"
    - "- trigger 1"
    - "- trigger 2"
    - "- trigger 3"
    - "KEY_METRICS:"
    - "- metric=value (date)"
    - "NOTES:"
    - "- caveats, methodology changes, source lags, or data gaps"
  score_semantics: "0 = lowest risk; 100 = highest risk; higher means greater caution and slower DCA"
