# MODULE TRANSFER HANDOFF — Quant Risk
#
# Received from Jason 2026-08-24 as part of a five-packet intake cycle.
# This is the module's own durable specification, not a Supervisor packet.
# The Supervisor consumes only `latest_state.score` and `latest_state.confidence`
# and never recomputes them. Everything else here is provenance and reproduction detail.
#
# INTAKE FLAG: latest_state.asof is 2026-08-14 close — the same run already recorded in
# supervisor/continuity_snapshot.yaml as the PRIOR Supervisor baseline. See NOTE at end of file.

MODULE_TRANSFER_HANDOFF:
  module_name: "Quant Risk"
  mission: >-
    Compute a repeatable, price-based extension signal for the S&P 500, Nasdaq-100,
    SPY, QQQ, and IWM; provide VIX context; translate the signal into model risk-band
    prices; and deliver one stable 0-100 QuantRisk score to the Market Allocation Ops
    Supervisor. The module is decision support for contribution/DCA pacing, not a
    forecast, support/resistance model, or fundamental valuation model.

  boundaries:
    owns:
      - "Daily close-price ingestion, validation, de-duplication, and as-of selection for the Quant universe."
      - "Core Risk Engine calculations: log price, EMA trend, deviation quantiles, risk_raw, risk_smooth, price_at_r, and four-week changes."
      - "Canonical official score using SPY and QQQ, with IWM as a breadth/extension diagnostic."
      - "Modern-window and full-history SPX/NDX comparisons, clearly labeled."
      - "VIX as a volatility overlay, including term structure when a reliable source is available."
      - "Experimental YouTuber/ITC-style risk-ladder emulation for BTC/ETH/COIN only when specifically requested."
      - "Strict data-quality disclosure for splices, fixed bands, stale endpoints, proxy continuations, and adjustedness."
    does_not_own:
      - "Fundamental valuation or expected-return estimates."
      - "Macro, policy, liquidity, credit-spread, or sentiment scoring."
      - "The final portfolio-wide DCA multiplier; the Supervisor combines this module with other modules."
      - "Tax-lot selection, taxable-sale recommendations, or execution timing."
      - "Treating model risk-band prices as forecasts, support levels, guarantees, or declarations that an asset is cheap."
      - "Adding BTC, ETH, COIN, or VIX to the official score unless Jason explicitly changes the methodology."

  risk_scale: >-
    Official module score is 0 to 100, where 0 means lowest modeled price-extension
    risk and 100 means highest modeled price-extension risk. Each asset also has
    risk_raw and risk_smooth on 0 to 1. Higher always means more extended versus the
    model trend/deviation bands and therefore more caution. VIX uses the same math,
    but a low VIX risk reading means subdued volatility, not low equity extension risk.

  current_scoring_methodology:
    formula:
      asset_engine: >-
        For each daily series, compute the Risk Engine specified under calculations.formulas.
      etf_composite_risk: "0.60 * SPY_risk_smooth + 0.40 * QQQ_risk_smooth"
      official_quant_score: "round(100 * ETF_composite_risk)"
      secondary_inputs: >-
        IWM is reported as a breadth/extension diagnostic. SPX and NDX are reference
        series. VIX is a volatility overlay. None is blended into the official score.
    component_weights:
      SPY_risk_smooth: 0.60
      QQQ_risk_smooth: 0.40
      IWM_risk_smooth: 0.00
      SPX_risk_smooth: 0.00
      NDX_risk_smooth: 0.00
      VIX_risk_smooth: 0.00
    normalization:
      asset_level: "risk_raw and risk_smooth are clamped/smoothed values in [0,1]."
      module_level: "Multiply the fixed SPY/QQQ composite by 100 and round to the nearest integer."
      quantile_method: "Full available as-of-sample 5th and 95th percentiles of dev, using linear interpolation unless explicitly changed."
      cross_asset_warning: >-
        Risk values are comparable only when series use comparable history windows and
        consistent price treatment. Never compare full-history SPX directly with modern-window
        SPY without labeling the calibration difference.
    thresholds:
      module_score_action_bands:
        "0_to_35": "Low modeled extension; Quant input can support faster contributions."
        "35_to_60": "Middle range; Quant input is broadly compatible with baseline contributions."
        "60_to_80": "Elevated extension; Quant input supports slower contributions."
        "80_to_100": "High/extreme extension; Quant input supports minimal or substantially reduced contributions."
      price_band_language:
        r0.9: "Less extremely extended; initial de-extension from an extreme regime."
        r0.8: "Meaningfully de-extended."
        r0.5: "Approximately neutral within this trend/deviation model."
        r0.2: "Deeply de-extended or unusually favorable in this model."
      caution: >-
        Module-score bands and price-at-risk r levels are related but not identical.
        price_at_r maps current risk_raw, whereas risk_smooth lags because of the 28-session EMA.
    methodology_history:
      - date: "2025-12 to 2026-01"
        change: >-
          Initial core implementation used Stooq daily closes and the 504-session log-price
          EMA plus full-history 5th/95th deviation quantiles; SPX/NDX and ETF readings were
          initially reported together.
      - date: "2026-01"
        change: >-
          Diagnosed large SPX-versus-SPY and NDX-versus-QQQ discrepancies as history-window
          effects. Truncating SPX to SPY's 1999 start and NDX to QQQ's 1999 start made the
          readings converge. SPY/QQQ became the canonical official-score inputs.
      - date: "2026-01"
        change: >-
          Replaced shorter Stooq ETF histories with Jason's uploaded SPY and IWM histories;
          QQQ uploaded history was effectively the same length as Stooq. Uploaded history was
          spliced to newer rows only after overlap validation.
      - date: "2026-01 onward"
        change: "Official score fixed at round(100 * (0.60 * SPY + 0.40 * QQQ))."
      - date: "2026-06 and 2026-08"
        change: >-
          Stooq refreshes were blocked. Reports used continuation estimates, observed closes,
          and fixed long-run bands. Those reports were explicitly lower-confidence and are not
          equivalent to a clean full-history recomputation.
      - date: "2026-08-17"
        change: >-
          New mandatory reporting standard added all r0.2/r0.5/r0.8/r0.9 levels, percentage
          distances, modern/full index labeling, VIX fields, prior-report comparison, expanded
          Supervisor Packet, and compact CSV output.
      - date: "experimental branch"
        change: >-
          A separate BTC/ETH YouTuber/ITC emulation workbook was created. It uses fitted
          power-law trends and, for BTC, a piecewise shape function from a published ladder.
          It is not the official equity QuantRisk methodology and should remain isolated.

  data_pipeline:
