    series_or_tickers:
      official_score_inputs: ["SPY", "QQQ"]
      required_dashboard_assets: ["SPX", "NDX", "SPY", "QQQ", "IWM"]
      volatility_overlay: ["VIXCLS"]
      optional_experimental_assets: ["COIN", "BTC", "ETH"]
      source_aliases:
        SPX: ["^SPX", "SPX", "FRED SP500"]
        NDX: ["^NDX", "NDX", "FRED NASDAQ100"]
        SPY: ["SPY.US", "SPY"]
        QQQ: ["QQQ.US", "QQQ"]
        IWM: ["IWM.US", "IWM"]
        VIX: ["VIXCLS", "^VIX"]
    history_windows:
      SPY_CANONICAL: "1999-01-04 onward, using the uploaded adjusted-history base plus validated continuation."
      QQQ_CANONICAL: "1999-03-10 onward, using the uploaded adjusted-history base plus validated continuation."
      IWM_CANONICAL: "2000-05-26 onward, using the uploaded adjusted-history base plus validated continuation."
      SPX_MODERN_1999: "1999-01-04 onward, aligned to SPY for dashboard comparison."
      NDX_MODERN_1999: "1999-03-10 onward, aligned to QQQ for dashboard comparison."
      SPX_FULL_HISTORY: >-
        Full Stooq history when available. Earlier pulls began 1789-05-01 and included
        early monthly/irregular observations; this is contextual only and must be labeled.
      NDX_FULL_HISTORY: "Full Stooq history when available; earlier pulls began 1985-10-01."
      VIX_FULL_HISTORY: "1990 onward using Cboe/FRED daily closes."
      rule: >-
        The Supervisor comparison table should use SPX_MODERN_1999 and NDX_MODERN_1999.
        Full-history index readings are separate context and never enter the official ETF score.
    adjusted_or_unadjusted_prices:
      current_canonical_policy: >-
        Use the uploaded SPY/QQQ/IWM Close columns as adjusted histories because their levels
        appear yfinance auto-adjusted. Preserve the same treatment in all appended rows.
      unresolved_source_issue: >-
        Stooq and emergency fallback close series may not have identical dividend-adjustment
        treatment. Validate overlaps around distributions and do not append a nominal close to
        an adjusted series merely because one recent date matches.
      volume: "Volume is not used by the Risk Engine."
      index_prices: "Index closes are naturally non-dividend total-return series unless a total-return index is explicitly selected."
    splice_or_proxy_rules:
      - "Sort ascending by date, retain one row per market date, and use positive finite closes only."
      - "For uploaded ETF histories, keep uploaded rows through 2025-12-26 and append only rows after that date from a validated source."
      - "Require overlap validation on several dates, not one date; compare levels and returns and inspect dividend dates."
      - "Never skip a multi-month gap and then continue an EMA from the endpoint as though no sessions occurred. Obtain the complete daily bridge."
      - "If a complete bridge is unavailable, report N/A or explicitly label a proxy continuation and lower confidence."
      - "If long-run dev_low/dev_high are held fixed instead of recomputed, disclose the calibration date and fixed-band method."
      - "Proxy index paths may be used only for provisional context; do not label them exact modern-window index readings."
    asof_selection_rule: >-
      Use the latest completed market close common to the equity/index series. Report the exact
      last observed date for every row. If VIX or another source lags, retain its true date rather
      than silently forward-filling it.
    incomplete_row_rule:
      - "Exclude the current day's row before the market close in America/Chicago."
      - "Treat a current-day row with partial volume or an unfinished timestamp as intraday and exclude it from close-based reports."
      - "Do not assume that the final API/CSV row is complete merely because it has today's date."
      - "For 24/7 crypto, define the UTC daily cutoff explicitly and do not mix it with U.S. equity close dates without labeling."

  calculations:
    formulas:
      ema_alpha: "alpha(h) = 1 - exp(log(0.5) / h)"
      ema_recursion: "EMA_t = alpha * x_t + (1 - alpha) * EMA_(t-1); initialize EMA_0 = x_0"
      log_price: "logP[t] = ln(price[t])"
      trend: "trend[t] = EMA(logP, halflife=504 observations, adjust=False)"
      deviation: "dev[t] = logP[t] - trend[t]"
      deviation_bands:
        dev_low: "quantile(dev[0:t], 0.05) using the full available as-of sample and linear interpolation"
        dev_high: "quantile(dev[0:t], 0.95) using the full available as-of sample and linear interpolation"
      log_price_bands:
        logP0: "logP0[t] = trend[t] + dev_low"
        logP1: "logP1[t] = trend[t] + dev_high"
      normalized_position: "u[t] = (logP[t] - logP0[t]) / (logP1[t] - logP0[t])"
      risk_raw: "risk_raw[t] = min(1, max(0, u[t]))"
      risk_smooth: "risk_smooth[t] = EMA(risk_raw, halflife=28 observations, adjust=False)"
      price_at_r: "price_at_r[t] = exp(logP0[t] + r * (logP1[t] - logP0[t])) for r in {0.2, 0.5, 0.8, 0.9}"
      spot_vs_r: "spot_vs_r = spot / price_at_r - 1; positive means spot is above the risk-level price"
      delta_4w: "delta_4w = risk_smooth[t] - risk_smooth[t-20], or nearest available completed session when exactly 20 is unavailable"
      etf_composite: "ETF_composite_risk = 0.60 * SPY_risk_smooth + 0.40 * QQQ_risk_smooth"
      module_score: "SCORE_0_100 = round(100 * ETF_composite_risk)"
    transformations:
      - "Parse dates as timezone-aware when timestamps are supplied; normalize equity rows to market dates."
      - "Sort ascending and remove duplicate dates before EMA calculations."
      - "Reject zero, negative, nonfinite, or missing prices before taking logs."
      - "Use one observation per trading session; the 504 and 28 halflives are observation counts, not calendar-day halflives."
      - "For irregular or early monthly index history, either trim to a daily era or use a time-aware EMA; do not silently call 504 rows two years."
      - "Retain sufficient precision internally; round only display outputs."
    derived_metrics:
      required_per_asset:
        - "ASOF"
        - "SPOT"
        - "RISK_RAW"
        - "RISK_SMOOTH"
        - "DELTA_4W"
        - "PRICE_R0.2"
        - "PRICE_R0.5"
        - "PRICE_R0.8"
        - "PRICE_R0.9"
        - "SPOT_VS_R0.2"
        - "SPOT_VS_R0.5"
        - "SPOT_VS_R0.8"
        - "SPOT_VS_R0.9"
        - "HISTORY_METHOD"
      additional:
        - "ETF_composite_risk"
        - "Quant SCORE_0_100"
        - "VIX term-structure metric when available"
        - "Current-versus-prior changes"
        - "Classification: risk rising, risk easing but still elevated, broadening extension, narrowing extension, meaningful de-extension, or regime break"
    experimental_itc_youtuber_branch:
      status: "Separate research branch; never substitute for the official equity engine without approval."
      BTC_model_in_v3_workbook:
        day_index: "calendar days since 2013-04-28 plus 1"
        trend_log: "-4.701056195372109 + 1.80044094191483 * ln(day_index)"
        log_P0: "trend_log - 0.03095704578873359"
        log_P1: "trend_log + 2.196048223178082"
        normalized_u: "clamp((log_price - log_P0) / (log_P1 - log_P0), 0, 1)"
        shape: >-
          Monotonic piecewise-linear g(u) built from the December 15, 2025 published
          BTC risk-price ladder. For every published pair (r_i, p_i), calculate
          u_i=(ln(p_i)-ln(P0_target))/(ln(P1_target)-ln(P0_target)), then interpolate g(u_i)=r_i.
        risk_raw: "g(normalized_u)"
        inverse_price_ladder: "u = inverse_g(r); price_at_r = exp(log_P0 + u * (log_P1 - log_P0))"
        fitted_snapshot_endpoints: "P0=35000 and P1=324522 from the December 15, 2025 ladder"
      ETH_model_in_v3_workbook:
        day_index: "calendar days since 2015-08-07 plus 1"
        trend_log: "-8.915589250273333 + 2.059783215792989 * ln(day_index)"
        log_P0: "trend_log - 1.823458744548333"
        log_P1: "trend_log + 1.342802183140254"
        risk_raw: "identity mapping: normalized_u"
        price_at_r: "exp(log_P0 + r * (log_P1 - log_P0))"
        fitted_snapshot_endpoints: "P0=511.36 and P1=12128.76 from the December 15, 2025 ladder"
      smoothing: "The workbook applies the same 28-observation EMA to experimental risk_raw."
      warning: >-
        Exact fit to one published ladder is interpolation, not proof that the YouTuber uses this
        mechanism. Use the December 31, 2025 snapshot and future snapshots for out-of-sample calibration.

  interpretation:
    low_risk_regime: >-
      Asset risk near r0.2 or module score 0-35 indicates deep de-extension relative to this
      model's trend and historical deviation distribution. This can support faster DCA, subject
      to liquidity, credit, macro, and portfolio constraints.
    neutral_regime: >-
      Asset risk near r0.5 or module score roughly 35-60 is approximately mid-band/neutral within
      the model. It is not a statement of fair fundamental value.
    high_risk_regime: >-
      Asset risk around r0.8 or module score 60-80 indicates material extension and generally
      supports slower contributions. A fall to r0.8 should be called meaningfully de-extended,
      not cheap.
    extreme_regime: >-
      Asset risk around r0.9-1.0 or module score 80-100 indicates extreme extension. A move to
      r0.9 is only an initial de-extension from the extreme regime. risk_smooth can remain high
      after spot crosses a lower risk_raw band because smoothing lags.

  supervisor_integration:
    official_score_field: "SCORE_0_100"
    confidence_definition: >-
      CONFIDENCE_0_100 measures data quality and signal clarity, not prediction confidence.
      Raise confidence when all series share a completed as-of date, full daily bridges are present,
      adjustedness is consistent, and bands are freshly recomputed. Lower it for stale data, proxy
      paths, fixed bands, source-treatment ambiguity, missing term structure, or incomplete index histories.
    key_metrics_required:
      required_snapshot_rows: ["SPX", "NDX", "SPY", "QQQ", "IWM"]
      required_fields_per_row:
        - "ASOF date"
        - "Spot price"
        - "risk_raw"
        - "risk_smooth"
        - "Four-week change in risk_smooth"
        - "price_at_r0.2"
        - "price_at_r0.5"
        - "price_at_r0.8"
        - "price_at_r0.9"
        - "Spot_vs_r0.2"
        - "Spot_vs_r0.5"
        - "Spot_vs_r0.8"
        - "Spot_vs_r0.9"
        - "History window/method"
      required_index_context:
        - "SPX_MODERN_1999 for comparison with SPY"
        - "SPX_FULL_HISTORY as separately labeled context when available"
        - "NDX_MODERN_1999 for comparison with QQQ"
        - "NDX_FULL_HISTORY as separately labeled context when available"
      required_vix_fields:
        - "VIX spot"
        - "VIX risk_raw"
        - "VIX risk_smooth"
        - "VIX delta_4w"
        - "VIX price_at_r0.8"
        - "VIX price_at_r0.9"
        - "VIX term-structure metric or N/A"
        - "VIX source and history window"
      required_change_table:
        - "Quant score: current, prior, change"
        - "SPY risk_smooth: current, prior, change"
        - "QQQ risk_smooth: current, prior, change"
        - "IWM risk_smooth: current, prior, change"
        - "ETF composite: current, prior, change"
        - "VIX risk_smooth: current, prior, change"
    change_my_mind_triggers:
      increase_toward_0_75x: >-
        A reasonable Quant contribution is met when SPY or QQQ approaches or falls below its
        current r0.8 price, the affected asset's risk_raw is near/below 0.8, risk_smooth is falling,
        and the ETF composite is no longer pinned near the extreme zone. The Supervisor must also
        confirm that credit remains orderly.
      return_toward_1_0x: >-
        A reasonable Quant contribution is met when both SPY and QQQ are materially de-extended,
        ETF_composite_risk is below 0.85 and falling, and neither asset immediately re-accelerates
        above r0.9. Other Supervisor modules must confirm the regime.
      reduce_toward_0_50x_or_below: >-
        A reasonable Quant contribution is met when ETF_composite_risk is at or above 0.95,
        SPY and QQQ are both above r0.9 with flat/rising risk_smooth, or a volatility shock occurs
        while the Supervisor's credit module reports widening stress.
      hard_rule: >-
        Triggers are conditions for Supervisor review, not automatic trades. Combine price and
        risk_smooth whenever possible, and do not call r0.8 or r0.9 cheap.
    overlap_with_other_modules:
      valuation: "Both can signal caution at high prices, but QuantRisk measures trend extension; Valuation measures fundamentals/expected returns."
      sentiment_technicals: "Momentum, breadth, and volatility may overlap; Quant should keep only price-band and simple VIX context."
      liquidity_credit: "Credit stress may affect DCA triggers but must come from the Liquidity/Credit module, not be recreated here."
