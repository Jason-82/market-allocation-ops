  known_caveats:
    - >-
      dev_low and dev_high depend on the full history window. Different start dates or regimes can
      create large differences even for near-identical underlying exposure.
    - >-
      Constant scale differences such as SPY being roughly one-tenth of SPX do not explain the gap;
      log transformation and de-trending remove constant multiplicative scale.
    - >-
      SPX full-history data previously included very early monthly/irregular observations, so a
      504-row EMA is not consistently a two-year EMA across that series.
    - >-
      The uploaded ETF files appear adjusted, while fallback sources may be nominal close series.
      Inconsistent dividend treatment can alter the long-run deviation distribution.
    - >-
      Full-sample quantiles are acceptable for live as-of monitoring but create lookahead bias if
      used unchanged in a historical backtest. Backtests need expanding or rolling quantiles.
    - "risk_smooth is deliberately lagging; spot can cross r0.8 while risk_smooth remains above 0.8."
    - "price_at_r levels move as trend and quantile bands update and should not be treated as static support."
    - "VIX uses the same mathematical scale but has opposite practical semantics from equity extension."
    - "The June 26 and August 14, 2026 equity reports used continuation estimates and fixed bands."
    - "The experimental BTC/ETH workbook exactly fits one ladder snapshot and is not validated as the YouTuber's true formula."

  known_failure_modes:
    - "Including an incomplete current-day row in a close-based report."
    - "Comparing SPX full-history risk with SPY modern-window risk as though they share one calibration."
    - "Appending unadjusted closes to an adjusted history, especially across dividend dates."
    - "Skipping missing daily sessions in a splice and thereby corrupting EMA trend and risk_smooth."
    - "Presenting fixed-band continuation values as a fresh full-history recomputation."
    - "Using proxy index paths without labeling them approximate."
    - "Recomputing historical performance with full-future-sample quantiles and calling it lookahead-free."
    - "Using calendar-day halflives on one asset and observation-count halflives on another without disclosure."
    - "Rounding intermediate calculations too early."
    - "Calling r0.8 or r0.9 cheap, or treating price_at_r as a forecast or guaranteed support level."
    - "Allowing VIX, IWM, SPX, or NDX to drift into the official score without formal approval."

