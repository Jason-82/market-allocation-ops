        role: "Preferred full daily histories and current closes for SPX, NDX, SPY, QQQ, and IWM."
        endpoints:
          SPX: "https://stooq.com/q/d/l/?s=%5Espx&i=d"
          NDX: "https://stooq.com/q/d/l/?s=%5Endx&i=d"
          SPY: "https://stooq.com/q/d/l/?s=spy.us&i=d"
          QQQ: "https://stooq.com/q/d/l/?s=qqq.us&i=d"
          IWM: "https://stooq.com/q/d/l/?s=iwm.us&i=d"
        caveat: "Provider access has sometimes been blocked by JavaScript verification."
      - source: "FRED VIXCLS"
        role: "Preferred VIX spot/history cross-check."
        endpoint: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS"
      - source: "Cboe VIX historical data"
        role: "Preferred complete VIX history when FRED download is delayed or unavailable."
    secondary_sources:
      - source: "FRED SP500 and NASDAQ100 series"
        role: "Exact index-close cross-check or fallback spot source; verify publication lag and series definition."
      - source: "StockAnalysis historical ETF pages"
        role: >-
          Emergency recent-close continuation when Stooq is unavailable. Do not use silently;
          document the upstream provider, price treatment, exact fetched range, and any missing bridge.
      - source: "Uploaded local histories"
        role: "Canonical long ETF histories through their file endpoints."
    uploaded_files:
      - filename: "SPY_historical_data.csv"
        sha256: "682da2e35f5b47bfd08a4fd5c13f8256038b6b53ca81b1cae6f2af056fff2dd5"
