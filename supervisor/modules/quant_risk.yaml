        bytes: 1819357
        workbook_role: >-
          Snapshot/output workbook for QQQ, COIN, and experimental BTC/ETH models.
          It is not a complete live core-equity workbook and lacks SPY, IWM, SPX, NDX, and VIX sheets.
        sheets:
          - "BTC: A1:I4626"
          - "ETH: A1:I3796"
          - "COIN: A1:L1184"
          - "QQQ: A1:L6744"
          - "Latest_Levels: A1:G17"
