  known_caveats:
    - "Beginning in April 2026, the FRED ICE OAS pages may expose only three years of history; archive data locally if longer context is needed."
    - "WALCL is a Wednesday level, while WRESBAL and WTREGEN are weekly averages ending Wednesday; their changes do not form an exact accounting identity."
    - "The numerical ample-reserve threshold is not officially fixed and can change with banking-system size, regulation, and reserve distribution."
    - "BAA10Y is affected by both corporate yields and Treasury yields and is not a pure default-risk spread."
    - "ON RRP depletion removes a buffer but is not itself a funding crisis."
    - "RPONTSYD can include small-value tests and is not always a clean measure of standing-repo stress."
    - "Primary-credit use can be idiosyncratic or seasonal; emphasize level, persistence, and acceleration."
    - "NFCI and STLFSI4 are lagged and overlap with credit and volatility inputs."
    - "TGA targets and issuance plans are forecasts and may change between quarterly refundings."
    - "A high TGA can drain reserves temporarily even while Fed assets are stable; interpret the flow jointly."

  known_failure_modes:
    - "Using today's intraday VIX with yesterday's credit close and labeling all metrics as the same as-of date."
    - "Reading the FRED page update timestamp as the observation date."
    - "Double-counting a TGA rise and reserve decline as two independent liquidity shocks."
    - "Calling reserves scarce solely because WRESBAL is below an absolute threshold."
    - "Treating near-zero ON RRP as a crisis signal."
    - "Treating a month-end or quarter-end repo spike as structural before checking next-day normalization."
    - "Failing to exclude announced 1-million-dollar test operations."
    - "Using RPONTSYD as exact standing-repo usage without checking NY Fed operation details."
    - "Counting reinvestment purchases as incremental reserve-management purchases."
    - "Allowing VIX to dominate the module without credit or funding confirmation."
    - "Using NFCI/STLFSI4 as independent large-weight signals despite embedded spread/volatility overlap."
    - "Changing risk thresholds after market moves in order to rationalize the desired score."
    - "Failing to lower confidence when core series are stale or missing."

  files_or_code_needed_for_reproduction:
    required_files: []
    recommended_code:
      - "A Python script using pandas/numpy for retrieval, date alignment, piecewise interpolation, score calculation, and audit-table output."
      - "A version-controlled YAML or JSON configuration containing every anchor, weight, overlay, and trigger in this handoff."
      - "A local CSV archive of ICE OAS observations because public FRED history may be truncated."
      - "A parser or API client for NY Fed standing-repo operation results and Treasury-purchase schedules."
      - "A saved prior-official-report row for score-change calculations."
    retrieval_options:
      - "FRED API with an API key."
      - "Public FRED CSV downloads when an API key is unavailable."
      - "NY Fed Markets Data API or official operation-result pages for repo usage."
    audit_requirement: >-
      Save raw value, raw unit, observation date, retrieval timestamp, transformed value,
      subscore, overlay, and final contribution for every report.

  unresolved_questions:
    - "Should absolute reserves be normalized by nominal GDP, bank assets, or deposits instead of using only trillion-dollar anchors?"
    - "What reserve level will the Fed operationally regard as the lower edge of ample as the banking system grows?"
    - "Should direct SRF usage replace RPONTSYD completely once a reliable automated NY Fed feed is implemented?"
    - "How much weight should reserve-management purchase plans receive when the Fed has authority to restart purchases quickly but currently schedules zero?"
    - "Should SOFR-IORB use volume-weighted intraday diagnostics or TGCR/EFFR confirmation in addition to daily SOFR?"
    - "How should primary-credit use be adjusted for known seasonal and institution-specific borrowing?"
    - "Does the VIX allocation remain 25 percent, or should it fall after Supervisor-level double-counting analysis with Sentiment/Technicals?"
    - "The formalized anchors have not yet been fully backtested across 2008, 2011, 2020, 2022, and 2023 stress episodes."

  recommended_next_improvements:
    - "Backtest the formal score and each subscore across major credit, repo, and banking-stress episodes; freeze revised anchors only after documented calibration."
    - "Add EFFR-minus-IORB, TGCR-minus-IORB, SOFR volume, and SOFR percentile data as optional funding confirmations."
    - "Build calendar-adjusted baselines for month-end, quarter-end, corporate tax dates, April individual tax payments, and Treasury settlement dates."
    - "Automate TGA attribution using matched H.4.1 liability components while preserving the warning that week averages and Wednesday levels differ."
    - "Archive all ICE OAS daily observations locally before FRED's rolling-history window removes older data."
    - "Create a reserve-scarcity dashboard that combines absolute reserves, reserve distribution proxies, SOFR-IORB, repo usage, and facility use."
    - "Add a score-change decomposition showing how many points came from credit, VIX, reserve buffer, funding, facilities, and broad conditions."
    - "Run a formal overlap study with Sentiment/Technicals and Macro/Policy to reduce Supervisor-level double counting."
    - "After three live reports under the formalized rules, review whether the 1-3 point transition difference versus manual scoring is acceptable and then freeze version 1.0."

