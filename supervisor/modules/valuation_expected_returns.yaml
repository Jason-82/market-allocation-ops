  unresolved_questions:
    - "Whether to replace annual-snapshot percentiles with monthly observations. This could improve statistical resolution but would require a full historical backfill and score recalibration."
    - "Whether a consistent long-history forward-P/E series can be licensed or assembled well enough to replace trailing P/E in the score."
    - "Whether price/sales should remain at 10% if sales-denominator lags continue to exceed two quarters."
    - "Whether market-cap-to-GDP should receive a small explicit weight or remain contextual because of globalization and denominator problems."
    - "Whether the 10Y real yield should enter the score directly. Current policy is no, because ERP tightness already uses the nominal 10Y and direct use would risk rate double counting."
    - "Whether institutional forecasts should remain nominal or move to provider-specific real returns. Current policy is nominal because it is more reproducible across providers."
    - "Whether QQQ/NDX deserves a separate tech-valuation subscore for the 20% sleeve rather than remaining contextual within an SPX-centric module."
    - "Whether CAPE should be supplemented by an intangible-adjusted, buyback-adjusted, or margin-normalized valuation measure."
    - "Whether the score should be calibrated directly against subsequent realized 10-year real returns rather than relying primarily on empirical valuation percentiles."

