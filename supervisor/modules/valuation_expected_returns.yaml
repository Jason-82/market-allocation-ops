  known_caveats:
    - "CAPE is structurally affected by accounting standards, index composition, payout policy, corporate taxes, margins, buybacks, and the growing role of intangible assets. Its percentile is informative but not a complete fair-value model."
    - "Trailing P/E can be distorted by cyclical earnings collapses or unusually high profit margins."
    - "Forward P/E depends on analyst estimates that are revised over time and often become less reliable near economic turning points."
    - "Price/sales ignores margins and capital intensity. A high-margin index can support a higher price/sales ratio than historical low-margin markets."
    - "The current price/sales denominator may lag the market price by multiple quarters. Always disclose the denominator date."
    - "Dividend yield is affected by buybacks and is therefore less comparable across very long histories."
    - "Market-cap-to-GDP is sensitive to globalization, foreign revenue, private versus public market composition, Federal Reserve balance-sheet adjustments, and provider definitions."
    - "The nominal ERP proxy is not a full ex-ante equity risk premium. It uses a trailing earnings yield and omits expected growth, payout, duration, default risk, and multiple change."
    - "Earnings yield minus real Treasury yield is not a complete expected real equity return spread and remains contextual."
    - "Institutional forecasts may define U.S. equities or U.S. large caps differently and may use different currency, inflation, fee, and valuation assumptions."
    - "Equal-weighting institutional providers is a pragmatic convention, not evidence that every model is equally accurate."
    - "Annual-snapshot percentile histories reduce serial correlation but can miss major intra-year valuation extremes."
    - "Multpl and similar aggregators may update price and fundamental denominators on different schedules, creating internally inconsistent current ratios."
    - "QQQ and Nasdaq-100 composition changes materially over time, and intangible-heavy firms can make historical price/sales and book-value comparisons less clean."
    - "High valuation is associated with lower long-horizon expected returns but is not a reliable short-term market-timing indicator."

  known_failure_modes:
    - "Silently mixing market prices, earnings, sales, GDP, yields, or forecasts from different as-of dates."
    - "Using an aggregator's current valuation ratio without checking its embedded index-price stamp."
    - "Multiplying earnings yield or dividend yield by the price-adjustment factor instead of dividing by it."
    - "Treating State Street FY1 P/E and FactSet forward 12-month P/E as identical or averaging them."
    - "Computing earnings yield from forward P/E while labeling it trailing earnings yield."
    - "Scoring nominal and real Treasury yields separately in addition to ERP tightness."
    - "Double counting starting valuation by heavily weighting institutional forecasts and valuation ratios."
    - "Adding QQQ valuation to the score without reducing another component weight."
    - "Including both a current-year annual row and a separate current observation in the percentile sample."
    - "Forward-filling missing historical fundamentals."
    - "Treating a stale institutional forecast as newly published because a secondary article was recently updated."
    - "Using a forecast published after the module ASOF."
    - "Failing to report the sales-denominator date for price/sales."
    - "Changing history windows or component weights without labeling a methodology revision."
    - "Allowing a one-week price move to create an implausibly large change in this slow-moving module."
    - "Presenting expensive valuation as proof that a near-term correction is imminent."
    - "Recommending taxable selling solely because the valuation score is high."
    - "Reporting numeric values without citations or publication dates."

