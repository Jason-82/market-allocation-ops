# MODULE TRANSFER HANDOFF — Macro & Policy (US equities)
#
# Received from Jason 2026-08-24, labelled "macro packet".
# NOTE: a second paste labelled "liquidity packet" contained this same Macro & Policy
# document verbatim. Recorded once here. See supervisor/modules/INTAKE_LEDGER.md.
#
# The Supervisor consumes only latest_state.score and latest_state.confidence.

MODULE_TRANSFER_HANDOFF:
  module_name: "Macro & Policy"
  mission: >
    Summarize the United States macroeconomic regime, recession risk, inflation
    trajectory, Treasury-curve configuration, growth impulse, and Federal Reserve
    policy stance most relevant to U.S. equities. Produce a stable 0-100 macro risk
    score in which higher values mean greater caution and a slower DCA pace for new
    contributions. Explain whether the regime is Disinflation + expansion,
    Inflationary growth, Stagflation risk, or Recession risk.

  boundaries:
    owns:
      - "U.S. inflation trend using CPI and PCE, including headline/core levels, monthly momentum, and release direction."
      - "Labor-market recession risk using unemployment, Sahm Rule, payrolls, revisions, participation, employment-population ratios, and household-versus-establishment survey divergence."
      - "Real growth using GDP, real final sales to private domestic purchasers, and real consumer-spending momentum."
      - "Treasury rates and curve configuration using 10-year, 2-year, and 3-month constant-maturity yields."
      - "Federal Reserve policy stance using the target range, policy actions, statement language, votes, dissents, minutes, implementation notes, and SEP changes."
      - "Macro regime classification and macro-only implications for U.S. equity contribution pacing."
      - "Upcoming official macro catalysts: CPI, PCE, Employment Situation, GDP releases, FOMC decisions, minutes, and SEP meetings."
      - "Large enacted fiscal-policy changes may be discussed as context when material, but there is not yet a formal fiscal subscore."
    does_not_own:
      - "Equity price trend, market breadth, momentum, positioning, or VIX scoring; these belong to Sentiment & Technicals."
      - "Credit spreads, defaults, funding markets, bank reserves, NFCI, or detailed lending conditions; these belong primarily to Liquidity/Credit."
      - "CAPE, equity-risk premium, earnings yield, or long-horizon expected returns; these belong to Valuation."
      - "Price-extension or risk-band calculations for SPX, NDX, SPY, QQQ, or IWM; these belong to Quant Risk."
      - "Final portfolio-level OverallRisk or final DCA multiplier; the Supervisor owns the composite decision."
      - "Taxable-sale recommendations or security-level trades."
      - "Forecasting election outcomes or political advocacy."

  risk_scale:
    range: "0-100"
    direction: "0 is lowest macro risk; 100 is highest macro risk and greatest caution."
    stable_action_bands:
      low_risk: "0-34"
      neutral_or_baseline: "35-59"
      high_risk_or_slow_DCA: "60-79"
      extreme_or_minimal_DCA: "80-100"
    boundary_rule: >
      Use nonoverlapping integer bands. A score of exactly 60 enters the high-risk
      band; a score of exactly 80 enters the extreme band.
    score_change_classification:
      unchanged: "absolute change 0-2 points"
      modest_change: "absolute change 3-5 points"
      meaningful_change: "absolute change 6-10 points"
      regime_shift: "absolute change greater than 10 points or macro-regime label changes"

  current_scoring_methodology:
    formula:
      methodology_status: >
        Prior reports used structured discretionary judgment and did not have a
        formally documented immutable equation. This handoff canonicalizes the
        effective framework into a reproducible formula. Use this formula beginning
        with the next full update. Do not claim that pre-handoff historical scores
        were mechanically generated by it.
      overall_score: >
        SCORE_0_100 = round(clamp(
        0.30 * InflationRisk +
        0.25 * LaborRecessionRisk +
        0.15 * GrowthRisk +
        0.15 * RatesCurveRisk +
        0.15 * FedPolicyRisk,
        0, 100))
      rounding: "Round the final weighted value to the nearest integer."
      component_range: "Every component and submetric is normalized to 0-100."
      no_hidden_overlay: >
        Do not make an undocumented adjustment directly to the overall score.
        Exceptional events must be reflected in the relevant component score and
        disclosed in NOTES.
      helper_functions:
        clamp: "clamp(x, low, high) = min(max(x, low), high)"
        lininterp: >
          Piecewise-linear interpolation through the listed [indicator_value,
          risk_score] anchors, clamped to the first and last anchor outside the range.
        sign_eps: >
          sign_eps(x, epsilon) = -1 when x < -epsilon, 0 when abs(x) <= epsilon,
          and +1 when x > epsilon.
      canonical_backcast_of_last_published_score:
        inflation_risk: 63
        labor_recession_risk: 58
        growth_risk: 35
        rates_curve_risk: 60
        fed_policy_risk: 74
        weighted_result_before_rounding: 58.75
        rounded_score: 59
        status: >
          Calibration backcast only. It demonstrates continuity with the last
          published score but is not evidence that the old report used these exact
          component values.

    component_weights:
      inflation_risk: 0.30
      labor_recession_risk: 0.25
      growth_risk: 0.15
      rates_curve_risk: 0.15
      fed_policy_risk: 0.15
      total: 1.00

    normalization:
      inflation_risk:
        purpose: >
          Measure persistent inflation pressure and its direction, while giving
          Fed-preferred core PCE more weight than CPI and discounting temporary
          headline energy shocks when core momentum is contained.
        subweights:
          core_pce_yoy: 0.30
          core_pce_3m_annualized: 0.25
          core_cpi_yoy: 0.15
          core_cpi_3m_annualized: 0.10
          headline_inflation_shock: 0.10
          inflation_direction: 0.10
        anchors:
          core_pce_yoy: [[1.5, 10], [2.0, 20], [2.5, 35], [3.0, 55], [3.5, 75], [4.0, 90], [5.0, 100]]
          core_pce_3m_annualized: [[0.0, 0], [1.5, 10], [2.0, 20], [2.5, 35], [3.0, 50], [4.0, 75], [6.0, 100]]
          core_cpi_yoy: [[1.5, 10], [2.0, 20], [2.5, 35], [3.0, 55], [3.5, 75], [4.0, 90], [5.0, 100]]
          core_cpi_3m_annualized: [[0.0, 0], [1.5, 10], [2.0, 20], [2.5, 35], [3.0, 50], [4.0, 75], [6.0, 100]]
          headline_cpi_or_pce_yoy: [[1.5, 10], [2.0, 20], [3.0, 45], [4.0, 70], [5.0, 90], [6.0, 100]]
        headline_inflation_shock_formula: >
          Normalize headline CPI YoY and headline PCE YoY separately and use their
          maximum. If the larger headline-core gap is at least 1.0 percentage point
          and both core CPI and core PCE 3-month annualized rates are 3.0 percent or
          lower, multiply the headline score by 0.75 to reflect lower persistence.
        inflation_direction_formula: >
          DirectionScore = clamp(
          50 +
          12.5 * sign_eps(CorePCE_YoY_t - CorePCE_YoY_t_minus_3m, 0.10) +
          12.5 * sign_eps(CoreCPI_YoY_t - CoreCPI_YoY_t_minus_3m, 0.10) +
          12.5 * sign_eps(CorePCE_3mAnn - CorePCE_YoY_t, 0.10) +
          12.5 * sign_eps(CoreCPI_3mAnn - CoreCPI_YoY_t, 0.10),
          0, 100)
        divergence_rule: >
          Do not choose either CPI or PCE and discard the other. PCE dominates the
          component because it is the Fed-preferred measure, while CPI supplies a
          timelier confirmation or warning. If CPI cools but PCE remains hot, score
          the PCE readings normally and describe the signal as mixed rather than
          declaring disinflation complete.
        missing_pce_rule: >
          If PCE is delayed beyond its normal one-month lag, do not estimate it from
          CPI. Reweight available inflation submetrics proportionally, subtract at
          least 5 confidence points, and state that the inflation component is
          provisional.

      labor_recession_risk:
        purpose: >
          Measure recession and earnings-downturn risk without relying only on the
          unemployment rate. A low unemployment rate is not automatically benign
          when payrolls stall, revisions are negative, or participation is falling.
        subweights:
          sahm_rule: 0.30
          unemployment_3m_trend: 0.15
          payroll_3m_average: 0.25
          payroll_revisions: 0.10
          participation_and_employment_ratio: 0.10
          household_establishment_divergence: 0.10
        anchors:
          sahm_rule_pp: [[-0.10, 5], [0.10, 15], [0.20, 30], [0.30, 45], [0.40, 65], [0.50, 80], [0.75, 100]]
          unemployment_3m_average_change_pp: [[-0.30, 10], [-0.10, 20], [0.00, 30], [0.10, 45], [0.20, 65], [0.40, 90], [0.60, 100]]
          payroll_3m_average_thousands: [[-100, 100], [0, 90], [25, 75], [50, 60], [75, 45], [100, 30], [150, 15], [200, 5]]
          combined_latest_two_month_payroll_revision_thousands: [[-200, 100], [-150, 90], [-100, 75], [-50, 50], [0, 25], [50, 10]]
          six_month_participation_stress_pp: [[0.00, 20], [0.20, 35], [0.40, 55], [0.70, 80], [1.00, 100]]
        unemployment_trend_formula: >
          UNRATE_3mTrend = average(UNRATE_t, t-1, t-2) minus
          average(UNRATE_t-3, t-4, t-5).
        payroll_formula: >
          Payroll_3mAverage = average of the latest three monthly changes in PAYEMS,
          using the latest official vintage.
        payroll_revision_formula: >
          RevisionTotal = current-release values for the two previously reported
          months minus the values published in the immediately preceding Employment
          Situation release. Preserve the prior release or ALFRED vintage so this can
          be calculated correctly.
        participation_formula: >
          OverallDrop = max(0, negative six-month change in CIVPART,
          negative six-month change in EMRATIO).
          PrimeAgeDrop = max(0, negative six-month change in LNS11300060,
          negative six-month change in LNS12300060).
          ParticipationStress = 0.60 * OverallDrop + 0.40 * PrimeAgeDrop.
        household_establishment_divergence_rules:
          score_20: >
            Household employment and PAYEMS have the same three-month sign and the
            absolute difference between their three-month changes is below 300,000.
          score_40: >
            They have the same sign but the difference is 300,000-750,000, or one is
            approximately flat.
          score_70: >
            They have opposite signs or the absolute difference is 750,000-1,500,000.
          score_90: >
            They have opposite signs and the absolute difference exceeds 1,500,000.
          score_100: >
            Severe divergence is accompanied by a participation decline of at least
            0.5 percentage point and combined payroll revisions of -100,000 or worse.
        sahm_interpretation: >
          SAHMCURRENT at or above 0.50 is a recession-confirmation threshold, not a
          leading forecast and not an automatic overall score of 80. Combine it with
          payrolls, growth, and revisions.
        low_unemployment_caveat: >
          A falling unemployment rate receives limited positive credit when the
          labor force or employment-population ratio is also falling materially.

      growth_risk:
        purpose: >
          Measure contraction risk while distinguishing noisy headline GDP from
          underlying private domestic demand.
        subweights:
          real_gdp_qoq_saar: 0.35
          real_final_sales_to_private_domestic_purchasers_saar: 0.45
          real_pce_3m_annualized: 0.10
          gdp_revision_and_two_quarter_trend: 0.10
        anchors:
          real_gdp_qoq_saar: [[-2.0, 100], [0.0, 80], [0.5, 70], [1.0, 60], [1.5, 50], [2.0, 40], [3.0, 20], [4.0, 10], [5.0, 5]]
          private_domestic_final_sales_saar: [[-2.0, 100], [0.0, 85], [0.5, 75], [1.0, 65], [1.5, 55], [2.0, 40], [3.0, 20], [4.0, 10], [5.0, 5]]
          real_pce_3m_annualized: [[-2.0, 100], [0.0, 85], [1.0, 65], [2.0, 40], [3.0, 20], [4.0, 10]]
          latest_estimate_minus_advance_estimate_pp: [[-2.0, 100], [-1.0, 85], [-0.5, 65], [0.0, 40], [0.5, 20], [1.0, 10]]
        interpretation_rule: >
          Real final sales to private domestic purchasers receive more weight than
          headline GDP because they exclude government purchases and net exports
          and better represent private domestic demand. A weak GDP print with strong
          private final sales is a slowdown warning, not a recession signal.
        revision_rule: >
          Use the newest official GDP vintage for the current score. Report the
          advance-to-current revision separately so users can distinguish a changed
          economy from revised measurement.

      rates_curve_risk:
        purpose: >
          Combine recession information in curve slopes with equity discount-rate
          pressure from the absolute 10-year yield. A positive curve is not
          automatically bullish when steepening is caused by rising long yields or
          hawkish policy repricing.
        subweights:
          absolute_10y_yield: 0.35
          spread_10y_3m: 0.25
          spread_10y_2y: 0.10
          spread_2y_3m: 0.20
          recent_10y_3m_inversion_legacy: 0.10
        anchors:
          dgs10_percent: [[2.5, 10], [3.0, 20], [3.5, 35], [4.0, 50], [4.5, 70], [5.0, 85], [6.0, 100]]
          spread_10y_3m_pp: [[-1.50, 100], [-1.00, 90], [-0.50, 75], [0.00, 55], [0.50, 30], [1.00, 20], [2.00, 10]]
          spread_10y_2y_pp: [[-1.00, 90], [-0.50, 70], [0.00, 50], [0.50, 30], [1.00, 20], [2.00, 10]]
          months_since_last_negative_10y_3m: [[0, 80], [6, 70], [12, 50], [18, 25], [24, 0]]
        spread_2y_3m_rules:
          score_70: "spread below -0.75pp; substantial easing or growth-fear pricing"
          score_55: "spread from -0.75pp to -0.25pp"
          score_35: "spread from -0.25pp to -0.10pp"
          score_25: "spread from -0.10pp to +0.20pp"
          score_55_hawkish: "spread from +0.20pp to +0.50pp"
          score_70_hawkish: "spread from +0.50pp to +0.75pp"
          score_85_hawkish: "spread above +0.75pp"
        sign_interpretation:
          negative_10y_3m: "Classic inversion; raises medium-term recession risk."
          positive_10y_3m: >
            Removes the current inversion signal but does not erase recession risk
            immediately after an inversion; use the inversion-legacy submetric.
          negative_10y_2y: "Inversion and growth-warning signal."
          negative_2y_3m: >
            Market expects future easing or weaker growth relative to the current
            short rate.
          positive_2y_3m: >
            Market prices higher-for-longer policy or additional tightening; this
            raises inflation/policy risk once the spread exceeds approximately 0.20pp.
          positive_steepening_from_higher_10y: >
            Not treated as unequivocally bullish. Absolute 10-year yield risk can
            outweigh the lower recession-shape score.

      fed_policy_risk:
        purpose: >
          Measure the equity-relevant policy impulse. Do not assume every rate cut
          is bullish or every hold is neutral; interpret actions in the inflation
          and growth context.
        subweights:
          policy_rate_gap_to_long_run_neutral: 0.25
          recent_policy_action: 0.20
          statement_press_conference_minutes_guidance: 0.25
          vote_and_dissent_balance: 0.15
          sep_rate_path_change: 0.15
        anchors:
          target_midpoint_minus_sep_long_run_median_pp: [[-1.00, 30], [0.00, 40], [0.50, 55], [1.00, 70], [2.00, 90], [3.00, 100]]
          current_year_sep_median_change_vs_prior_sep_pp: [[-1.00, 10], [-0.50, 25], [0.00, 50], [0.50, 75], [1.00, 100]]
        recent_policy_action_scores:
          orderly_cut_with_disinflation_and_stable_labor: 25
          dovish_hold: 35
          balanced_hold: 50
          hawkish_hold: 70
          twenty_five_bp_hike: 90
          emergency_cut_or_intermeeting_action: 90
        guidance_tone_scores:
          clearly_dovish: 25
          balanced_data_dependent: 50
          hawkish_or_higher_for_longer: 75
          explicit_likely_tightening: 90
        vote_score_formula: >
          VoteScore = clamp(
          50 + 100 * (number_of_hike_dissents - number_of_cut_dissents)
          / total_voters,
          0, 100)
        guidance_classification:
          hawkish: >
            Classify as hawkish when the statement, press conference, or minutes
            indicate that tightening is likely or necessary if inflation does not
            improve, or when at least two voters prefer a hike.
          dovish: >
            Classify as dovish when officials indicate likely cuts and inflation is
            improving without a material labor or growth break.
          emergency: >
            A cut of 50bp or more, an intermeeting cut, or crisis facilities tied to
            acute stress is not scored as benign easing; use the emergency score.
        context_interactions:
          under_restriction_floor: >
            If the policy-rate midpoint is below the latest core PCE inflation rate
            and InflationRisk is at least 60, set the policy-rate-gap subscore to at
            least 70.
          recessionary_cut_floor: >
            If cuts are occurring while LaborRecessionRisk or GrowthRisk is at least
            70, set RecentPolicyAction to at least 70 even though rates are falling.
          minutes_rule: >
            Minutes may move the guidance subscore by up to 10 points relative to the
            statement-based classification when they reveal a materially broader or
            narrower policy consensus. Minutes do not change the recorded policy action.

    thresholds:
      stable_component_alerts:
        inflation_raise_risk:
          - "Core PCE YoY rises by at least 0.20pp across two consecutive releases."
          - "Core PCE 3-month annualized inflation exceeds 3.5%."
          - "Both core CPI and core PCE momentum are above their YoY rates."
          - "Headline inflation broadens beyond energy into core goods and services."
        inflation_lower_risk:
          - "Core PCE YoY is below 3.0%."
          - "Core PCE 3-month annualized inflation is 2.5% or lower."
          - "Core CPI and core PCE both improve for two consecutive releases."
        labor_raise_risk:
          - "SAHMCURRENT reaches 0.35pp for caution and 0.50pp for recession confirmation."
          - "Three-month average payroll growth falls below 50,000."
          - "Three-month average payroll growth is zero or negative."
          - "Combined two-month payroll revisions are -100,000 or worse."
          - "Participation or employment-population ratio falls at least 0.5pp over six months."
        labor_lower_risk:
          - "SAHMCURRENT remains below 0.20pp."
          - "Three-month average payroll growth stabilizes above 100,000."
          - "Payroll revisions are approximately neutral or positive."
          - "Participation and employment-population ratios stabilize."
        growth_raise_risk:
          - "Real GDP and private domestic final sales are both below 1.0% SAAR."
          - "Either measure contracts and labor indicators are also weakening."
          - "A GDP estimate is revised downward by at least 1.0pp."
        growth_lower_risk:
          - "Private domestic final sales remain above 3.0% SAAR."
          - "Real PCE momentum remains above 2.0% without renewed inflation."
        curve_raise_risk:
          - "10y-3m re-inverts to -0.25pp or lower."
          - "10-year yield exceeds 4.75% while inflation remains elevated."
          - "2y-3m exceeds +0.50pp, indicating material tightening repricing."
          - "2y-3m falls below -0.75pp alongside weakening labor data."
        curve_lower_risk:
          - "10-year yield falls below 4.25% without recession evidence."
          - "The curve remains positive and inflation expectations stay contained."
        fed_raise_risk:
          - "The FOMC hikes."
          - "At least three voters prefer a hike."
          - "The SEP current-year median funds rate rises by at least 0.50pp."
          - "Guidance says further tightening is likely or necessary."
        fed_lower_risk:
          - "Hike dissents disappear."
          - "Guidance shifts to balanced or dovish as core inflation improves."
          - "The SEP rate path falls without a labor or growth break."
      macro_regime_label_rules:
        disinflation_plus_expansion: >
          InflationRisk below 60, LaborRecessionRisk below 65, and GrowthRisk below 65.
        inflationary_growth: >
          InflationRisk at least 60 while both LaborRecessionRisk and GrowthRisk are
          below 65.
        stagflation_risk: >
          InflationRisk at least 60 and either LaborRecessionRisk or GrowthRisk is at
          least 65.
        recession_risk: >
          InflationRisk below 60 and either LaborRecessionRisk or GrowthRisk is at
          least 65; SAHMCURRENT at or above 0.50 is strong confirmation.
        tie_breaker: >
          When a component is within two points of a regime threshold, use the
          direction of its latest two releases. State explicitly that the label is
          borderline.

    methodology_history:
      - period: "2025-12 through 2026-03"
        approach: >
          Structured qualitative scoring based on curve, labor, inflation, and Fed
          policy. No fixed numerical component weights were documented.
        reported_scores:
          - {asof: "2025-12-22 close", score: 52}
          - {asof: "2026-01-09 close", score: 49}
          - {asof: "2026-02-11 close", score: 46}
          - {asof: "2026-03-04 close", score: 49}
      - period: "2026-06"
        approach: >
          Same structured judgment. Inflation and Fed-policy risk became dominant
          after CPI/PCE reacceleration, while stable labor prevented a more extreme score.
        reported_scores:
          - {asof: "2026-06-25 close", score: 63}
      - period: "2026-08"
        approach: >
          Same structured judgment. Cooling CPI/PCE lowered risk, but elevated
          long yields, hike dissents, and weak payroll internals kept the score near 60.
        reported_scores:
          - {asof: "2026-08-13 close", score: 59}
      - effective_period: "Next full update after this migration handoff"
        change: >
          Adopt the explicit 30/25/15/15/15 weighted formula and preserve component
          scores in every update.
        continuity_note: >
          This is a formalization, not a change to the meaning of the 0-100 scale.
          Backtests may differ from historical reported scores by several points.

  data_pipeline:
    primary_sources:
      fred_treasury_and_labor:
        provider: "Federal Reserve Bank of St. Louis FRED"
        use: >
          Daily Treasury constant maturities and standardized labor series. FRED is
          an official mirror; the underlying H.15, BLS, or BEA release remains authoritative.
      bureau_of_labor_statistics:
        releases: ["Employment Situation", "Consumer Price Index"]
        use: >
          Official release text and tables for current payroll changes, revisions,
          unemployment, participation, CPI direction, composition, and release dates.
      bureau_of_economic_analysis:
        releases: ["Personal Income and Outlays", "Gross Domestic Product"]
        use: >
          Official PCE inflation, real PCE, GDP, private domestic final sales,
          revisions, and release schedules.
      federal_reserve_board:
        releases:
          - "FOMC statement"
          - "FOMC implementation note"
          - "FOMC minutes"
          - "Summary of Economic Projections"
          - "FOMC calendar"
        use: >
          Official target range, action, vote, dissents, guidance, reserve-policy
          language, SEP medians, and catalyst dates.

    secondary_sources:
      - "ALFRED vintages for reconstructing what payroll, GDP, or other revised series showed at an earlier report date."
      - "Archived BLS Employment Situation and CPI releases."
      - "Archived BEA Personal Income and Outlays and GDP releases."
      - "Official FOMC press-conference transcript when statement language is insufficient."
      - "Atlanta Fed or New York Fed nowcasts may be cited as context only and receive zero score weight unless the methodology is formally revised."

    uploaded_files:
      used_by_this_module: []
      rule: >
        No currently uploaded ETF, crypto, or Quant Risk files are required or
        appropriate for this module. Do not use SPY, QQQ, IWM, BTC, ETH, or risk-model
        spreadsheets to manufacture macro inputs.

    series_or_tickers:
      treasury_yields:
        DGS10: "10-Year Treasury constant maturity, daily, percent, not seasonally adjusted"
        DGS2: "2-Year Treasury constant maturity, daily, percent, not seasonally adjusted"
        DGS3MO: "3-Month Treasury constant maturity, daily, percent, not seasonally adjusted"
      labor:
        UNRATE: "Civilian unemployment rate; BLS source code LNS14000000"
        SAHMCURRENT: "Sahm Rule Recession Indicator"
        PAYEMS: "All Employees, Total Nonfarm; BLS source code CES0000000001"
        CE16OV: "Civilian employment level from the household survey"
        CIVPART: "Labor-force participation rate; BLS source code LNS11300000"
        EMRATIO: "Employment-population ratio; BLS source code LNS12300000"
        LNS11300060: "Prime-age 25-54 labor-force participation rate"
        LNS12300060: "Prime-age 25-54 employment-population ratio"
        CES0500000003: "Average hourly earnings of all private employees; secondary inflation cross-check"
      inflation:
        CUSR0000SA0: "Headline CPI-U seasonally adjusted index for monthly momentum"
        CUUR0000SA0: "Headline CPI-U not seasonally adjusted index for YoY change"
        CUSR0000SA0L1E: "Core CPI-U seasonally adjusted index for monthly momentum"
        CUUR0000SA0L1E: "Core CPI-U not seasonally adjusted index for YoY change"
        PCEPI: "Headline PCE chain-type price index, monthly, seasonally adjusted"
        PCEPILFE: "Core PCE chain-type price index, monthly, seasonally adjusted"
      growth:
        A191RL1Q225SBEA: "Real GDP percent change from preceding quarter, SAAR"
        PB0000031Q225SBEA: "Real final sales to private domestic purchasers, percent change SAAR"
        LB0000031Q020SBEA: "Level of real final sales to private domestic purchasers"
        PCEC96: "Real personal consumption expenditures"
      federal_reserve:
        target_range: "Lower and upper bounds stated in the latest FOMC statement"
        sep_current_year_funds_rate: "Median appropriate federal-funds rate for the current year"
        sep_long_run_funds_rate: "Median longer-run federal-funds rate"
        vote_count: "Recorded votes and direction of dissents in the FOMC statement"

    history_windows:
      treasury_yields:
        current: "Latest common daily observation"
        short_change: "1 month and 3 months"
        medium_change: "12 months"
        inversion_legacy: "Prior 24 months"
      unemployment_and_sahm:
        current: "Latest monthly reference period"
        trend: "3-month average versus preceding 3-month average"
        sahm_window: "Official three-month average relative to prior 12-month minimum"
      payrolls:
        momentum: "Latest monthly change and 3-month average"
        revisions: "Latest two previously reported months"
        context: "12-month average and sector breadth when material"
      participation:
        trend: "3 months and 6 months"
        cross_check: "Overall and prime-age series"
      inflation:
        current: "Latest m/m and YoY"
        momentum: "3-month and 6-month annualized"
        direction: "Change from previous release and from three months earlier"
      growth:
        current: "Latest quarter"
        context: "Previous four quarters"
        revisions: "Advance, second, and third estimate when available"
      fed_policy:
        actions: "Latest three meetings"
        guidance: "Latest statement, press conference, and minutes"
        sep: "Latest SEP versus immediately prior SEP"

    adjusted_or_unadjusted_prices:
      asset_prices_applicable: false
      series_conventions:
        treasury_yields: "Not seasonally adjusted daily percentages."
        unemployment_and_payrolls: "Use seasonally adjusted monthly series."
        cpi_monthly_change: "Use seasonally adjusted CPI indexes or official SA release figures."
        cpi_yoy: "Use not-seasonally-adjusted CPI indexes or official NSA YoY figures."
        pce: "Use BEA seasonally adjusted chain-type indexes."
        gdp_and_private_final_sales: "Use seasonally adjusted annualized quarterly growth rates."
      unit_rule: >
        Report yield and inflation differences in percentage points. Use basis points
        only as a secondary translation and label them explicitly.

    splice_or_proxy_rules:
      - "Do not splice private market-data vendors into official FRED, BLS, BEA, or Fed series."
      - "If a FRED mirror and the direct official release disagree, use the newest direct official release and document the discrepancy."
      - "Do not estimate missing PCE from CPI."
      - "Do not synthesize a missing unemployment or CPI month."
      - "Official BEA imputations may be used because they are part of the published series, but must be disclosed and reduce confidence."
      - "Nowcasts are context only and do not replace official GDP or PCE readings."
      - "No fiscal-policy proxy is currently included in SCORE_0_100."

    asof_selection_rule:
      market_series: >
        Use the latest date on which DGS10, DGS2, and DGS3MO all have nonmissing
        observations. This common date becomes the report's market-rate ASOF and must
        be labeled 'close.'
      monthly_series: >
        Use the latest officially released reference month available at run time.
        Record both the observation/reference period and the release date in the
        human-readable report.
      quarterly_series: >
        Use the latest official GDP vintage available at run time and state whether
        it is advance, second, or third estimate.
      policy_series: >
        Use the latest FOMC decision. If minutes were subsequently released, use them
        to update guidance interpretation while retaining the decision date for the
        target range.
      report_asof: >
        The Supervisor packet ASOF is normally the latest common Treasury date.
        KEY_METRICS must carry their own dates because labor, CPI, PCE, GDP, and Fed
        observations have different reference periods.
      observation_vs_release_date: >
        An observation date identifies the economic period measured; a release date
        identifies when the information became available. Never substitute one for
        the other. The analysis should mention both when release timing is material.

    incomplete_row_rule:
      daily_rates: >
        If any of DGS10, DGS2, or DGS3MO is missing on the latest date, step backward
        to the most recent common complete date. Never mix different daily dates to
        calculate a spread.
      monthly_macro: >
        Do not forward-fill a missing current observation as though it were new.
        Either use the prior value explicitly labeled stale or reweight within the
        component, reduce confidence, and explain the gap.
      missing_component_weight: >
        Reweight available submetrics proportionally only when no more than 30% of a
        component's weight is missing. If more than 30% is unavailable, carry the
        prior component score provisionally and subtract at least 10 confidence points.
      shutdown_rule: >
        During a government shutdown or release disruption, list every affected
        series, do not create synthetic observations, use only officially released
        alternatives, and reduce confidence by 5-15 points depending on severity.
      preliminary_data_rule: >
        Advance GDP and the latest payroll estimate may be used, but their preliminary
        status must be disclosed. Preserve prior vintages for revision analysis.

  calculations:
    formulas:
      spread_10y_3m_pp: "DGS10 - DGS3MO"
      spread_10y_2y_pp: "DGS10 - DGS2"
      spread_2y_3m_pp: "DGS2 - DGS3MO"
      yield_change_pp: "yield_t - yield_prior"
      yield_change_bp: "100 * yield_change_pp"
      unemployment_3m_average: "mean(UNRATE_t, UNRATE_t-1, UNRATE_t-2)"
      unemployment_3m_trend: "mean(UNRATE_t through t-2) minus mean(UNRATE_t-3 through t-5)"
      sahm_rule_reconstruction: >
        3-month average UNRATE minus the minimum 3-month average UNRATE during the
        previous 12 months; use official SAHMCURRENT as the primary value.
      payroll_monthly_change_thousands: "PAYEMS_t - PAYEMS_t-1"
      payroll_3m_average_thousands: "mean of the latest three PAYEMS monthly changes"
      payroll_revision_thousands: >
        Sum of the changes to the two previously reported monthly payroll estimates
        between the current and immediately preceding Employment Situation releases.
      cpi_yoy_percent: "100 * (CPI_NSA_t / CPI_NSA_t-12 - 1)"
      cpi_3m_annualized_percent: "100 * ((CPI_SA_t / CPI_SA_t-3)^4 - 1)"
      pce_yoy_percent: "100 * (PCE_Index_t / PCE_Index_t-12 - 1)"
      pce_3m_annualized_percent: "100 * ((PCE_Index_t / PCE_Index_t-3)^4 - 1)"
      real_pce_3m_annualized_percent: "100 * ((RealPCE_t / RealPCE_t-3)^4 - 1)"
      overall_score: >
        round(clamp(0.30*InflationRisk + 0.25*LaborRecessionRisk +
        0.15*GrowthRisk + 0.15*RatesCurveRisk + 0.15*FedPolicyRisk, 0, 100))

    transformations:
      - "Use index levels rather than averaging published monthly percentage changes when calculating 3-month annualized inflation."
      - "Treat all rate spreads as percentage-point differences."
      - "Preserve full precision internally; round yields and spreads to two decimals in the report."
      - "Round CPI, PCE, unemployment, and growth rates to one decimal unless an official release reports more precision that is analytically important."
      - "Use the current official vintage for the current state and a stored prior vintage for revision calculations."
      - "Separate economic change from data revision in the 'what changed' discussion."
      - "Classify a change in score before writing the narrative so wording matches the stable change thresholds."

    derived_metrics:
      - "InflationRisk, LaborRecessionRisk, GrowthRisk, RatesCurveRisk, and FedPolicyRisk."
      - "MacroRiskScore or SCORE_0_100."
      - "Macro regime label."
      - "Near-term recession-risk assessment: low, low-to-moderate, elevated, or high."
      - "Net policy impulse for equities: supportive, mildly supportive, mixed, mildly restrictive, or restrictive."
      - "Change versus prior score and component contributions to that change."
      - "Upcoming-catalyst list with exact release dates and times."
      - "Macro-only DCA interpretation, while leaving the final portfolio decision to the Supervisor."

  interpretation:
    low_risk_regime:
      score_range: "0-34"
      typical_label: "Disinflation + expansion"
      conditions:
        - "Core PCE near 2% with contained short-run momentum."
        - "Sahm well below 0.35 and payroll growth healthy."
        - "Private domestic demand growing above approximately 2.5-3.0%."
        - "No active Fed tightening bias."
        - "Long yields not imposing exceptional valuation pressure."
      interpretation: >
        Macro conditions are broadly supportive. This module may support accelerated
        contributions, but it does not independently determine the final pace.
    neutral_regime:
      score_range: "35-59"
      typical_labels: ["Disinflation + expansion", "Borderline inflationary growth"]
      conditions:
        - "Mixed but nonrecessionary labor data."
        - "Inflation improving but still above target, or growth slowing without contraction."
        - "Fed data-dependent rather than clearly easing or tightening."
      interpretation: >
        Baseline contributions are normally appropriate from the macro module alone.
        Do not accelerate simply because one CPI release improves.
    high_risk_regime:
      score_range: "60-79"
      typical_labels: ["Inflationary growth", "Recession risk", "Early stagflation risk"]
      conditions:
        - "Persistent inflation and hawkish Fed policy."
        - "Very high long yields."
        - "Meaningful labor deterioration or weak private demand."
        - "Conflicting inflation and growth risks that constrain policy."
      interpretation: >
        Macro conditions support slower contributions. Prefer changing the pace of
        new contributions rather than recommending taxable selling.
    extreme_regime:
      score_range: "80-100"
      typical_labels: ["Stagflation risk", "Recession risk"]
      conditions:
        - "Sahm trigger plus contractionary growth and deteriorating payrolls."
        - "Severe inflation persistence with active tightening."
        - "Emergency easing associated with financial or economic stress."
        - "Multiple modules of macro stress confirmed simultaneously."
      interpretation: >
        Macro conditions support minimal contributions until triggers improve.
        Extreme scores require broad confirmation, not a single hot or weak release.

  supervisor_integration:
    official_score_field: "SCORE_0_100"
    official_module_name: "Macro & Policy (US equities)"
    confidence_definition:
      meaning: >
        Confidence measures data quality, freshness, revision risk, and agreement
        among signals. It is not confidence in a forecast or market prediction.
      formula:
        base: 95
        penalties:
          advance_gdp_only: -5
          combined_two_month_payroll_revision_at_or_below_minus_100k: -5
          material_household_establishment_divergence: -5
          cpi_and_pce_direction_conflict: -5
          pce_more_than_two_reference_months_behind_cpi: -5
          required_submetric_missing_but_reweightable: -5
          component_more_than_30_percent_missing: -10
          official_shutdown_imputation_or_major_release_disruption: "-5 to -15"
          source_discrepancy_not_fully_resolved: -5
        bounds: "Clamp confidence to 40-95."
      disclosure_rule: >
        NOTES must identify the specific penalties responsible for confidence below 90.
    key_metrics_required:
      treasury: ["DGS10 with observation date", "DGS3MO with observation date", "DGS2 with observation date", "10y-3m spread", "10y-2y spread", "2y-3m spread"]
      labor:
        - "UNRATE"
        - "SAHMCURRENT"
        - "Latest payroll change"
        - "Three-month average payroll change"
        - "Combined latest two-month payroll revisions"
        - "CIVPART"
        - "EMRATIO"
        - "Survey-divergence assessment"
      inflation:
        - "Headline CPI m/m and YoY"
        - "Core CPI m/m and YoY"
        - "Headline PCE m/m and YoY"
        - "Core PCE m/m and YoY"
        - "Core CPI and core PCE 3-month annualized rates when computable"
      growth:
        - "Real GDP q/q SAAR and estimate vintage"
        - "Real final sales to private domestic purchasers q/q SAAR"
        - "Real PCE momentum when relevant"
      fed:
        - "Target range"
        - "Latest action date"
        - "Vote count and dissent direction"
        - "Guidance classification"
        - "Latest SEP change when an SEP was released"
      score:
        - "Each of the five component scores"
        - "Overall SCORE_0_100"
        - "Change versus prior score"
        - "Macro regime label"
        - "CONFIDENCE_0_100"
    change_my_mind_triggers:
      required_count: 3
      construction:
        - "One trigger must describe what would materially raise macro risk."
        - "One trigger must describe what would materially lower macro risk."
        - "The third should address the most uncertain current signal, such as labor divergence, inflation persistence, or Fed reaction."
      stable_examples:
        - "Raise risk if core PCE 3-month annualized exceeds 3.5%, inflation broadens, or the Fed hikes."
        - "Raise recession risk if payrolls remain near zero, SAHMCURRENT approaches 0.50, and participation continues falling."
        - "Lower risk if core PCE falls below 3.0%, payroll growth stabilizes above 100k, and long yields decline without recession evidence."
    overlap_with_other_modules:
      liquidity_credit: >
        Macro may discuss the Fed's target range, QT policy, and ample-reserve
        language. Liquidity/Credit owns actual reserves, bank funding, credit spreads,
        lending conditions, defaults, and NFCI-type measures.
      sentiment_technicals: >
        Macro may explain how a catalyst could affect equities, but does not score
        VIX, market breadth, momentum, positioning, or price action.
      valuation: >
        Macro scores high Treasury yields as financial-condition and policy risk.
        Valuation owns the effect of discount rates on fair value, ERP, CAPE, and
        expected returns.
      quant_risk: >
        Macro does not use market-price extension, EMA bands, or risk_smooth to alter
        its score.
      supervisor: >
        The Supervisor combines modules, resolves overlaps, and sets the final DCA
        multiplier.
    double_counting_warnings:
      - "Do not import HY OAS, NFCI, reserve quantities, or bank-lending scores into MacroRisk if Liquidity/Credit is already scoring them."
      - "Do not add a second valuation penalty merely because the 10-year yield is high; Macro captures policy and financial-condition pressure, while Valuation captures pricing consequences."
      - "Do not increase MacroRisk because SPY or QQQ fell; market price action belongs to Quant and Sentiment."
      - "Do not score Fed ample-reserve language as a full liquidity easing when the Liquidity module separately measures actual reserves."
      - "Do not count payroll weakness twice through both the labor and growth components unless GDP or private demand independently confirms it."
      - "Do not treat headline energy inflation, core inflation, and hawkish Fed policy as three independent shocks without acknowledging their causal relationship."

