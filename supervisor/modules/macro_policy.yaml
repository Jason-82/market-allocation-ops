  known_caveats:
    - "Historical scores before this handoff were not generated by a formal weighted equation."
    - "The Sahm Rule is primarily a coincident recession signal and may confirm weakness after markets have already moved."
    - "Payroll data are revised monthly and annually; first estimates can materially misstate the trend."
    - "Household and establishment surveys measure different concepts and can diverge for legitimate methodological reasons."
    - "Overall participation is affected by demographics; always cross-check prime-age participation and employment ratios."
    - "A positive yield curve after an inversion can reflect either improving growth or recessionary easing; curve level and policy context are required."
    - "High long yields may reflect real growth, inflation expectations, term premium, fiscal supply, or policy expectations; do not assign a single cause without evidence."
    - "CPI is timelier than PCE, while PCE is more relevant to the Fed; different release lags can create temporary conflict."
    - "Energy, tariffs, wars, supply disruptions, or other relative-price shocks can raise headline inflation without equal persistence in core inflation."
    - "Advance GDP and private-demand estimates are revision-prone."
    - "FOMC language classification contains limited judgment even with stable scoring categories."
    - "Fiscal impulse has not been formalized as a separate scored component."
    - "Official release schedules can change during shutdowns, emergencies, or agency rescheduling."
    - "The module provides decision support, not financial advice."

  known_failure_modes:
    - "Mixing Treasury observations from different dates when calculating spreads."
    - "Calling a positive 10y-3m spread automatically bullish without considering recent inversion history or a rising 10-year yield."
    - "Calling labor strong solely because unemployment is low while payrolls, participation, or revisions deteriorate."
    - "Comparing revised current payroll values with unrevised values from an old report without identifying the revision."
    - "Using CPI as an undocumented substitute for delayed PCE."
    - "Treating one soft CPI release as proof that inflation is resolved."
    - "Treating all Fed cuts as bullish even when cuts respond to recession or financial stress."
    - "Treating a hold as neutral when dissents and guidance indicate a live tightening bias."
    - "Double counting high yields in Macro, Valuation, and Liquidity without distinguishing each module's purpose."
    - "Using VIX, SPY, QQQ, or market drawdowns to alter the macro score."
    - "Inventing values for shutdown-related or missing observations."
    - "Failing to state whether GDP is an advance, second, or third estimate."
    - "Using release date as though it were the observation period."
    - "Publishing catalyst dates from memory instead of checking official calendars."
    - "Changing component weights or thresholds without documenting a methodology revision."

  files_or_code_needed_for_reproduction:
    required:
