  output_contract:
    human_readable_sections:
      - "Title: Macro & Policy Agent Update - US equities"
      - "Run date and explicit as-of anchors for rates, labor, CPI, PCE, GDP, and Fed policy"
      - "MacroRiskScore, change from prior score, confidence, and macro-regime label"
      - "Yield-curve table with DGS10, DGS3MO, DGS2, all three spreads, and change versus prior update"
      - "Labor and recession-risk section covering unemployment, Sahm, payrolls, revisions, participation, and survey divergence"
      - "Inflation section reconciling CPI and PCE, including headline/core, m/m, YoY, and direction"
      - "Growth section covering GDP and real final sales to private domestic purchasers"
      - "Fed-policy section covering target range, action, vote, dissents, guidance, minutes, SEP, and balance-sheet language"
      - "Three to six key drivers and what changed since the prior update"
      - "Near-term recession-risk assessment"
      - "Net policy impulse for U.S. equities"
      - "Macro-only contribution-pacing interpretation"
      - "Upcoming catalysts with exact official dates and times when available"
      - "SUPERVISOR PACKET as the final content in the response"
    supervisor_packet:
      title: "SUPERVISOR PACKET (COPY/PASTE)"
      placement: "Always the final section of every full update."
      formatting_rules:
        - "Use exactly one triple-backtick plain-text code block."
        - "Use the exact keys shown below."
        - "Keep every driver, trigger, metric, and note to one line."
        - "No markdown table syntax inside the packet."
        - "Higher score always means more risk and more caution."
        - "Include metric-specific dates when reference periods differ."
        - "NOTES must identify data gaps, imputation, revisions, and methodology changes."
      exact_template: |
        MODULE: Macro & Policy (US equities)
        ASOF: YYYY-MM-DD close
        SCORE_0_100: NN
        CONFIDENCE_0_100: NN
        TOP_3_DRIVERS:
        - One-line driver
        - One-line driver
        - One-line driver
        CHANGE_MY_MIND (TRIGGERS):
        - One-line trigger
        - One-line trigger
        - One-line trigger
        KEY_METRICS:
        - DGS10=value (YYYY-MM-DD close)
        - DGS3MO=value (YYYY-MM-DD close)
        - DGS2=value (YYYY-MM-DD close)
        - spread_10y_3m=value (YYYY-MM-DD close)
        - spread_10y_2y=value (YYYY-MM-DD close)
        - spread_2y_3m=value (YYYY-MM-DD close)
        - UNRATE=value (YYYY-MM)
        - SAHMCURRENT=value (YYYY-MM)
        - payroll_change=value (YYYY-MM)
        - payroll_3m_average=value (YYYY-MM)
        - payroll_revision=value (reported YYYY-MM-DD)
        - labor_force_participation=value (YYYY-MM)
        - CPI_YoY=value (YYYY-MM)
        - CoreCPI_YoY=value (YYYY-MM)
        - PCE_YoY=value (YYYY-MM)
        - CorePCE_YoY=value (YYYY-MM)
        - Real_GDP_SAAR=value (YYYY-QN and estimate vintage)
        - Private_domestic_final_sales_SAAR=value (YYYY-QN and estimate vintage)
        - Fed_target_range=value (YYYY-MM-DD)
        - FOMC_vote=value (YYYY-MM-DD)
        NOTES:
        - One line covering caveats, release lags, revisions, missing data, imputation, and methodology status.
    spreadsheet_or_csv_output:
