  known_caveats:
    - "ETF-relative breadth is a proxy for participation and leadership, not a true exchange advance-decline measure."
    - "Price-only relative returns omit dividends when adjusted series are unavailable."
    - "Short 20D and 63D windows can differ slightly across providers because of holiday handling, stale rows, or fixed-date performance conventions."
    - "Public performance tables sometimes report rounded returns rather than exact closing-price calculations."
    - "VIX3M or FRED VXVCLS may lag the latest VIX close by one session."
    - "A single volatility spike can distort VIX's trailing 52-week range and position."
    - "SPY moving averages differ if one provider uses adjusted close and another uses raw close."
    - "Low VIX is a vulnerability indicator, not a precise correction-timing signal."
    - "A high module score can represent opposite market states: a complacent melt-up or an active breakdown."
    - "High-beta outperformance can be healthy breadth before it becomes overheating; the heat adjustment is intentionally secondary."
    - "The formalized subscore anchors in this handoff were not stored in prior executable code; they codify the established narrative and component scores for continuity."
    - "The latest inherited state used some approximate public-price calculations and should not be treated as an audited backtest record."

  known_failure_modes:
    - "Using an intraday quote as the official close."
    - "Mixing today's VIX with yesterday's VIX3M without disclosure."
    - "Mixing adjusted and unadjusted prices in a moving average or relative pair."
    - "Using unmatched dates for the numerator and denominator of a relative-return pair."
    - "Subtracting rounded performance-table returns when exact daily ratio returns are available."
    - "Interpreting all low-VIX conditions as low risk."
    - "Interpreting every VIX increase as high risk, even when it is an orderly reset in contango."
    - "Treating healthy RSP/SPY or IWM/SPY leadership as fragility."
    - "Allowing extreme SPHB/SPLV strength to dominate otherwise healthy breadth."
    - "Calling a shallow break below the 50DMA a long-term trend breakdown while SPY remains above the 200DMA."
    - "Ignoring simultaneous deterioration in RSP/SPY and IWM/SPY."
    - "Double-counting SPY extension already represented in the Quant Risk module."
    - "Changing weights or sign conventions from one update to the next without a methodology note."
    - "Reporting a score without explaining whether it reflects extension or breakdown."
    - "Failing to carry forward the exact prior score when calculating change."
    - "Relying on a paywalled sentiment source that cannot be reproduced by the next agent."

